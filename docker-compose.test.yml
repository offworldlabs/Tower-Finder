# ── Test droplet override on the prod base (retina-test) ─────────────────────
# The retina-test droplet: production's stack on test-*.retina.fm, fed entirely
# by the synthetic fleet. Deployed as:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# Structurally this is staging's twin, so it strips the same prod-only base
# attributes (see docker-compose.staging.yml for the reasoning behind each
# !override / !reset). It differs from staging in serving real domains over TLS
# with a bigger fleet, and in being the box we are free to push until it breaks.
#
# Requires Docker Compose >= 2.24 for the !reset / !override merge tags.
#
# Endpoints (nginx routing in deploy/nginx-test.conf, NGINX_PROFILE=test):
#   https://test-towers.retina.fm  → tower search
#   https://test-api.retina.fm     → API + WebSocket
#   https://test-map.retina.fm     → React live-radar map (synthetic fleet)
#   https://test-dash.retina.fm    → dashboard

services:
  tower-finder:
    container_name: retina-test-server
    # The base pins tower-finder:latest for the rollback tooling. Reset it so this
    # droplet keeps Compose's implicit per-project name and cannot collide with a
    # prod image tag if the two ever share a registry.
    image: !reset null
    environment:
      # Same value prod runs, and for the same reason (auth bypass while we build).
      # Note this leaves four backend auth/secret guards inactive; see ClickUp
      # 86cb1emcx, which tracks fixing that properly rather than per-environment.
      - RETINA_ENV=test
      # Select nginx-test.conf. Never derived from RETINA_ENV: prod runs the same
      # value and must keep its production nginx.conf, so every non-prod stack
      # names its profile explicitly.
      - NGINX_PROFILE=test
      - CORS_ORIGINS=https://test-towers.retina.fm,https://test-api.retina.fm,https://test-map.retina.fm,https://test-dash.retina.fm
      # Pin the ingest port so it always matches the fleet's FLEET_PORT below even
      # if backend/.env is incomplete on a freshly provisioned box.
      - RADAR_TCP_PORT=3012
      # The fleet is the only detection source here and pushes hard, so keep the
      # frame pool at prod's width rather than staging's 6. This is one of the
      # dials to watch when chasing the 0.5s fleet interval: the solver, not the
      # tracker, is the ceiling.
      - FRAME_WORKERS=8
      - FRAME_QUEUE_SIZE=10000
    # A freshly rsync'd droplet has no backend/.env: `just deploy-test` excludes it
    # so the box keeps its own secrets. The base declares it required, which aborts
    # the whole `up` before the build with "env file not found", naming a missing
    # file rather than the missing provisioning step. Make it optional so the stack
    # comes up either way; when the file IS present it is still loaded, keeping the
    # fleet and server in step on RADAR_API_KEY. Mirrors docker-compose.local.yml.
    env_file: !override
      - path: backend/.env
        required: false
    # bash, not sh: start.sh's supervisor uses `wait -n`, a bash builtin dash
    # rejects ("Illegal option -n"), which crash-loops the server.
    command: ["/bin/bash", "/app/deploy/start.sh"]
    # Keep the cert mount (this droplet does serve TLS) but drop the base's data
    # volumes: nothing here is worth persisting across a recreate, and a clean
    # slate on every deploy is a feature on a box meant for load experiments.
    volumes: !override
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    # No retina-edge network on this droplet; the base attaches the app to it.
    networks: !override
      - default
    # retina-test reports 3915 MB usable and 2 cores, so the base's prod limits
    # (4 G here plus the fleet's 2 G) would commit more than the box has. Docker
    # limits are ceilings rather than reservations, so that does not fail at boot;
    # it just hands the OOM killer the choice of which container dies under load.
    #
    # 2200 (app) + 900 (fleet) = 3100, leaving ~800 MB for the OS, dockerd, and
    # crucially the image build: `--build` runs the Vite frontend and dashboard
    # builds on the droplet, which are the most memory-hungry thing that happens
    # here and which run while the previous containers are still up during a
    # redeploy. Provisioning also adds 2 G of swap for that reason.
    #
    # The solver is CPU-bound and the fleet mostly waits on TCP, hence 1.5/0.5.
    deploy: !override
      resources:
        limits:
          cpus: "1.5"
          memory: 2200M

  fleet:
    container_name: retina-test-fleet
    # As above: no shared image tag with prod.
    image: !reset null
    # As the server above: optional, so a droplet without backend/.env still starts.
    env_file: !override
      - path: backend/.env
        required: false
    environment:
      # 200 nodes. Measured at 100 the box sat at 131 MB / 11% CPU of a 2200 MB
      # and 1.5-core allowance with zero frame drops, so the earlier caution was
      # unwarranted. This is now the highest node count of any environment,
      # which is the point: it is the box we are free to push until it breaks.
      - FLEET_NODES=200
      # Metro layout is pinned rather than inherited. The base concentrates
      # production on two rings (see docker-compose.yml); this environment keeps
      # the single-ring shape it has always had, so a change aimed at production
      # does not silently alter node geometry here too.
      - FLEET_N_CLUSTERS=1
      - FLEET_N_CLUSTER=8
      - FLEET_INTERVAL=40.0
      # Log the read-only accuracy self-check every 30s: this droplet exists to be
      # measured, so the "VALIDATION: server=N aircraft, truth=M ..." line is worth
      # having. The base leaves it false so prod does not log it.
      - FLEET_VALIDATE=true
    restart: unless-stopped
    # See the app's limits above for the arithmetic. The app gets the larger share
    # because the solver is what this box exists to measure.
    deploy: !override
      resources:
        limits:
          cpus: "0.5"
          memory: 900M

# Neutralise the inherited external retina-edge declaration so a deploy does not
# fail looking for an edge network that is not present (no service attaches to it:
# the app is overridden to `default` above). Compose drops top-level
# networks/volumes no service references, so neither this declaration nor the
# base's data volumes appear in the resolved config. Kept in step with the
# identical block in docker-compose.staging.yml and docker-compose.local.yml.
networks:
  retina-edge:
    external: false
