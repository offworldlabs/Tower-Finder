# ── Test overlay (the retina-test droplet) ───────────────────────────────────
# Combined with docker-compose.yml (the shared base), exactly like the prod and
# staging overlays. This file carries only the values that are inherently
# per-environment: hostnames/CORS · droplet capacity · fleet scale.
#
# Usage (the host's ./.env sets COMPOSE_FILE, so this is normally implicit):
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# This replaced a standalone, non-overlay file that declared its own build,
# volumes, healthcheck and cert mount, and booted deploy/start-test.sh to copy a
# hand-maintained deploy/nginx-test.conf into place. It was the last stack
# outside the shared template, and so the last place a header, rate limit or
# route could differ from what production serves without anything noticing.
#
# What this environment is for is trying a branch under load before it is
# reviewed. It runs the same fleet shape staging does, so a change measured here
# means something about what staging will then see; it is deployed by rsync from a
# working tree (`just deploy-test`) rather than from main, which is the difference
# that matters.

services:
  tower-finder:
    container_name: retina-test-server
    # Consumed by services/alerting.py, which otherwise sees the container id or
    # the service name (varies by Compose version), neither of which says which
    # droplet raised an alert.
    hostname: retina-test
    # No TCP ingest, for the same reason staging closes it: there are no real
    # receiver nodes here, and the fleet reaches the server as tower-finder:3012
    # over the compose network rather than via the host port. Publishing it would
    # be pure exposure — and RETINA_ENV=test silences the missing-RADAR_NODE_TOKEN
    # warning, so anything on the internet could register itself as a node.
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      # Same value prod and staging run while admin access stays open during the
      # build-out. Tracked in ClickUp 86cb1emcx; revert to the real environment
      # name there, not here.
      - RETINA_ENV=test
      # Unrelated to RETINA_ENV above: this labels alerts only, so it carries the
      # real environment name even while RETINA_ENV is pinned to `test`. See
      # services/alerting.py for why the two must not be the same variable.
      - ALERT_ENVIRONMENT=test
      - CORS_ORIGINS=https://test-towers.retina.fm,https://test-api.retina.fm,https://test-map.retina.fm,https://test-dash.retina.fm,https://test-admin.retina.fm
      # Hostnames consumed by deploy/render-nginx-config.py, which start.sh runs
      # at boot to render deploy/nginx/nginx.conf.template.
      #
      # This droplet's Cloudflare origin certificate is scoped to four SANs
      # (test-towers, test-api, test-map, test-dash) rather than being the
      # *.retina.fm wildcard prod and staging share. The other three vhosts below
      # still render — the template needs a name for every one of them, and
      # keeping the variable set the same shape across environments is what lets
      # the parity check compare the rendered configs — but they have neither DNS
      # nor a cert, so they are deliberately unreachable. Add SANs and A records
      # before pointing anything at them.
      - HOST_MAIN=test-towers.retina.fm
      - HOST_API=test-api.retina.fm
      - HOST_MAP=test-map.retina.fm
      - HOST_DASH=test-dash.retina.fm
      - HOST_ADMIN=test-admin.retina.fm
      - HOST_TESTMAP=test-testmap.retina.fm
      - HOST_LEGACY_REDIRECT=test-tower-finder.retina.fm
      - CSP_CONNECT_SRC=https://test-api.retina.fm https://test-admin.retina.fm wss://*.retina.fm
    # Matched to staging deliberately, so a measurement here transfers. Same
    # droplet size (3915 MB, 2 cores); this one also has 2 GB of swap, which is
    # slack rather than something the limits are sized to use.
    #
    # Measured under a fleet four times heavier than the one below, the app sat at
    # 152 MiB and the fleet at 25 MiB, with swap untouched. Memory is not what
    # constrains these boxes — CPU is, and the solver holds the GIL — so these are
    # ceilings with an order of magnitude of headroom, not a calculated fit.
    #
    # CPU is deliberately overcommitted (1.5 + 1.0 on 2 cores). Limits are
    # ceilings, so this lets the solver take what it needs while the fleet is
    # between sends rather than reserving a core that then idles.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1600M

  fleet:
    container_name: retina-test-fleet
    environment:
      # 50 nodes at a 1.0s per-node detection rate. FLEET_INTERVAL is per node —
      # orchestrator.py staggers each node's first send by interval/n_nodes and
      # re-arms at +interval — so the aggregate the server sees is
      # n_nodes / interval = 50 frames/s, 4x production's 12.5.
      #
      # Kept identical to staging on purpose. This droplet's value is telling you
      # what staging will do before main does, which only works while the two run
      # the same fleet.
      #
      # 4x production's frame rate, but 8x its per-core load: production has 4
      # cores and these droplets have 2, so this is 25 fps/core against prod's 3.1.
      #
      # Measured here at this size: the frame path copes (41 of 50 fps, nothing
      # dropped, frame queue at zero) while the solver does not. Per-solve cost is
      # 45-52s against production's 17s, the solver queue oscillates to ~28% where
      # production sits at 0%, and the success rate is 8% against production's 80%.
      # Usable, but not a faithful rehearsal of production's solver.
      #
      # 200 nodes at 0.5s was tried first and was much worse: 178 of a notional 400
      # fps, latency past 30s and still climbing. If you want that overload again,
      # set it here, watch it, and set it back — do not leave it on, and do not put
      # it on staging.
      #
      # Watch solver_avg_latency_s over minutes, not seconds: it is a cumulative
      # mean, so a fresh boot reads low and climbs for several minutes while it
      # converges. solver_last_latency_s is the honest per-solve number. Reading
      # the average at 50s is how this was first, wrongly, called healthy.
      - FLEET_NODES=50
      - FLEET_REGIONS=us
      - FLEET_METRO=gvl
      # Held at prod's 16/25 proportion of the node count, so changing the fleet
      # size does not change the share of nodes with designed coverage geometry
      # (shared illuminator, aimed antennas, low GDOP). FLEET_METRO already forces
      # all 50 into the one metro; this only decides how many of them get the
      # coverage-cluster treatment rather than an ordinary tower.
      - FLEET_N_CLUSTER=32
      - FLEET_N_CLUSTERS=1
      # Same reasoning as staging: the ring surrounds the core with receivers that
      # all share one illuminator and all aim inward, which is geometry a real
      # fleet will not have. Scatter clumps sites where people live and varies the
      # hardware, so the load being measured is load the system will actually meet.
      - FLEET_LAYOUT=scatter
      - FLEET_METRO_TRAFFIC_FRAC=0.85
      - FLEET_MODE=adsb
      # 50 nodes / 1.0s = 50 fps
      - FLEET_INTERVAL=1.0
      - FLEET_TIME_SCALE=1.0
      # Above prod's 15-30, below the 40-60 the overload run used. Aircraft count
      # is independent of node count, but it multiplies solver work: pairing cost
      # goes as nodes x aircraft, so it is the other half of the load knob.
      - FLEET_MIN_AIRCRAFT=25
      - FLEET_MAX_AIRCRAFT=40
      - FLEET_BEAM_WIDTH_DEG=0
      - FLEET_MAX_RANGE_KM=0
      # Gates concurrent connection *establishment* only, not the steady-state
      # send rate. Half the node count, so the fleet reconnects in two batches
      # after a deploy.
      - FLEET_CONCURRENCY=25
      - FLEET_CONNECT_RETRIES=30
    # Measured at 25 MiB running four times these nodes, so 400M is generous.
    # Matched to staging so the two stay comparable.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 400M
