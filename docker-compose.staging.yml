# ── Staging override on the prod base ────────────────────────────────────────
# Deltas over docker-compose.yml for the CI staging gate. Deployed as:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
# Most of the base is inherited so staging cannot drift from production; the
# !override / !reset / external:false blocks below strip prod-only base
# attributes staging never had (data volumes, the retina-edge network, the
# fleet's .env, the pinned rollback image names), keeping staging's resolved
# config equivalent to its former standalone form.
#
# Requires Docker Compose >= 2.24 for the !reset / !override merge tags below
# (the staging droplet runs 2.40). Prod is unaffected: it runs the base alone.

services:
  tower-finder:
    container_name: retina-staging-server
    # The base pins an explicit image name for the rollback tooling (see
    # docker-compose.yml); standalone staging never set one and relied on
    # Compose's implicit per-project auto-naming. Reset it so staging keeps
    # that implicit name rather than colliding with prod's `tower-finder:latest`.
    image: !reset null
    environment:
      - RETINA_ENV=staging
      # Explicitly select nginx-staging.conf. start.sh does not derive the nginx
      # profile from RETINA_ENV (prod runs RETINA_ENV=test), so staging names it.
      - NGINX_PROFILE=staging
      - CORS_ORIGINS=https://staging-towers.retina.fm,https://staging-api.retina.fm,https://staging-dash.retina.fm,https://staging-map.retina.fm
      - RADAR_TCP_PORT=3012
      - FRAME_WORKERS=6
      - FRAME_QUEUE_SIZE=10000
    command: ["/bin/bash", "/app/deploy/start.sh"]
    # Standalone staging mounted only the cert; the base additionally mounts
    # backend-data / backend-coverage-data. Replace the list so staging keeps
    # just the cert mount it had.
    volumes: !override
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    # Standalone staging published ports directly and never joined retina-edge
    # (the base does). Keep the server on the compose default network only.
    networks: !override
      - default
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  fleet:
    container_name: retina-staging-fleet
    # As above: drop the base's pinned image name so staging's fleet keeps its
    # former implicit auto-named image rather than sharing prod's tag.
    image: !reset null
    # The base's fleet loads backend/.env (for RADAR_API_KEY); standalone
    # staging's fleet did not. Drop the inherited env_file so staging's fleet
    # runtime environment matches its former self.
    env_file: !override []
    environment:
      - FLEET_NODES=50
      - FLEET_REGIONS=us
      - FLEET_MODE=adsb
      - FLEET_INTERVAL=40.0
      - FLEET_TIME_SCALE=1.0
      - FLEET_MIN_AIRCRAFT=20
      - FLEET_MAX_AIRCRAFT=40
      - FLEET_BEAM_WIDTH_DEG=0
      - FLEET_MAX_RANGE_KM=0
      - FLEET_CONCURRENCY=10
      - FLEET_CONNECT_RETRIES=10
      - FLEET_HOST=tower-finder
      - FLEET_PORT=3012
      - FLEET_VALIDATE=false
      - FLEET_VALIDATION_URL=http://tower-finder:8000
      - FLEET_SEED=42
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

# Neutralise the inherited external retina-edge declaration so a staging deploy
# does not fail looking for an edge network that is not present (no service
# attaches to it: the server is overridden to `default` above). Compose drops
# top-level networks/volumes no service references, so neither this declaration
# nor the base's data volumes appear in the resolved staging config. Kept in
# step with the identical block in docker-compose.local.yml.
networks:
  retina-edge:
    external: false
