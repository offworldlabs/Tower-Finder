# ── Staging overlay ──────────────────────────────────────────────────────────
# Combined with docker-compose.yml (the shared base). Everything that is not
# inherently per-environment lives in the base; this file carries only the
# staging values for the things that legitimately differ:
#   hostnames/CORS · droplet capacity · fleet scale
#
# Staging deliberately mirrors production in every other respect — same image
# pins, same volumes, same healthcheck, same nginx template, same authenticated
# ingest path — so a change that breaks prod breaks staging first.
#
# Usage (the host's ./.env sets COMPOSE_FILE, so this is normally implicit):
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#
# Adding anything else here will fail deploy/check-env-parity.sh in CI. If a new
# setting really is per-environment, add its key to that script's allowlist in
# the same commit, so the divergence is a recorded decision rather than drift.

services:
  tower-finder:
    container_name: retina-staging-server
    # No TCP ingest on staging. The base publishes 3012 for real receiver nodes;
    # staging has none, and its own fleet reaches the server as tower-finder:3012
    # over the compose network, never via the host port. Verified with `ss`: zero
    # established connections on it. Publishing it was therefore pure exposure —
    # and worse than it looks, because RETINA_ENV=test silences the missing
    # RADAR_NODE_TOKEN warning, so anything on the internet could have registered
    # itself as a node here. Production keeps 3012; that is where real nodes land.
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      # Deliberately `test`, not `production`/`staging`, while admin access stays
      # open during the build-out. This leaves four backend auth/secret guards
      # inactive — JWT_SECRET stops being required, AUTH_BYPASS applies when no
      # OAuth is configured, and the missing-key warnings in radar.py and
      # tcp_handler.py downgrade. Tracked in ClickUp 86cb1emcx; revert to the
      # real environment name there, not here.
      - RETINA_ENV=test
      - CORS_ORIGINS=https://staging-towers.retina.fm,https://staging-api.retina.fm,https://staging-map.retina.fm,https://staging-dash.retina.fm,https://staging-admin.retina.fm
      # Hostnames consumed by deploy/render-nginx-config.py, which start.sh runs
      # at boot to render deploy/nginx/nginx.conf.template. One template serves
      # both environments; only these values change.
      #
      # Every vhost is defined here even where no DNS record exists yet
      # (staging-admin): the Cloudflare origin cert is
      # *.retina.fm, so an unresolved name costs nothing, and keeping the two
      # variable sets the same shape is what lets the parity check assert the
      # rendered configs are identical.
      - HOST_MAIN=staging-towers.retina.fm
      - HOST_API=staging-api.retina.fm
      - HOST_MAP=staging-map.retina.fm
      - HOST_DASH=staging-dash.retina.fm
      - HOST_ADMIN=staging-admin.retina.fm
      - HOST_TESTMAP=staging-testmap.retina.fm
      - HOST_LEGACY_REDIRECT=staging-tower-finder.retina.fm
      # The only host-naming part of the CSP. wss://*.retina.fm already covers
      # both environments, so only the two explicit origins vary.
      - CSP_CONNECT_SRC=https://staging-api.retina.fm https://staging-admin.retina.fm wss://*.retina.fm
    # Sized to the droplet, which is the point of an overlay. staging has 3915 MB
    # and NO swap, of which ~1.7 GB is already spoken for (dockerd ~460 MB, the
    # DigitalOcean agent ~760 MB, journald), leaving ~2.2 GB actually available.
    # The previous 3G + the fleet's 1G committed 4096 MB — more than the machine
    # physically has, and nearly double what is free. Limits are ceilings rather
    # than reservations so it does not fail at boot; it means the OOM killer picks
    # the victim under load, and with no swap there is no slack to absorb a spike.
    # The dangerous moment is a deploy: `docker compose up --build` runs the Vite
    # and dashboard builds on-box while the previous containers are still up.
    # Real usage is ~136 MB, so 1600 MB is still an order of magnitude of headroom.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1600M

  fleet:
    container_name: retina-staging-fleet
    environment:
      # Scoped to the Greenville, SC metro, and ~60% of prod's node count: the
      # staging droplet is smaller. This is the intended difference between the
      # two environments — everything else is meant to match.
      - FLEET_NODES=15
      - FLEET_REGIONS=us
      - FLEET_METRO=gvl
      - FLEET_N_CLUSTER=10
      - FLEET_N_CLUSTERS=1
      # Undesigned community layout rather than the ring.  The ring surrounds
      # the core with receivers that all share one illuminator and all aim
      # inward — geometry a real fleet will not have, so staging was measuring
      # the solver under conditions it will not meet.  Scatter clumps sites
      # where people live, gives each its own nearby illuminator, aims by hand
      # and varies the hardware.  Prod keeps the ring for the demo.
      - FLEET_LAYOUT=scatter
      - FLEET_METRO_TRAFFIC_FRAC=0.85
      - FLEET_MODE=adsb
      # 15 nodes / 2.0s = 7.5 fps
      - FLEET_INTERVAL=2.0
      - FLEET_TIME_SCALE=1.0
      - FLEET_MIN_AIRCRAFT=10
      - FLEET_MAX_AIRCRAFT=20
      - FLEET_BEAM_WIDTH_DEG=0
      - FLEET_MAX_RANGE_KM=0
      - FLEET_CONCURRENCY=10
      - FLEET_CONNECT_RETRIES=10
    # See the app's limits above for the arithmetic. The fleet sits at ~27 MB with
    # 15 nodes, so 400 MB is generous; the app should get the larger share.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 400M
