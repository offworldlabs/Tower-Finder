# ── Staging overlay ──────────────────────────────────────────────────────────
# Combined with docker-compose.yml (the shared base). Everything that is not
# inherently per-environment lives in the base; this file carries only the
# staging values for the things that legitimately differ:
#   hostnames/CORS · droplet capacity · fleet scale
#
# Staging deliberately mirrors production in every other respect — same image
# pins, same volumes, same healthcheck, same nginx template, same authenticated
# ingest path — so a change that breaks prod breaks staging first.
#
# Usage (the host's ./.env sets COMPOSE_FILE, so this is normally implicit):
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#
# Adding anything else here will fail deploy/check-env-parity.sh in CI. If a new
# setting really is per-environment, add its key to that script's allowlist in
# the same commit, so the divergence is a recorded decision rather than drift.

services:
  tower-finder:
    container_name: retina-staging-server
    environment:
      - RETINA_ENV=staging
      - CORS_ORIGINS=https://staging.retina.fm,https://staging-api.retina.fm,https://staging-map.retina.fm,https://staging-dash.retina.fm,https://staging-admin.retina.fm
      # Hostnames consumed by deploy/render-nginx-config.py, which start.sh runs
      # at boot to render deploy/nginx/nginx.conf.template. One template serves
      # both environments; only these values change.
      #
      # Every vhost is defined here even where no DNS record exists yet
      # (staging-admin, staging-testapi): the Cloudflare origin cert is
      # *.retina.fm, so an unresolved name costs nothing, and keeping the two
      # variable sets the same shape is what lets the parity check assert the
      # rendered configs are identical.
      - HOST_MAIN=staging.retina.fm
      - HOST_API=staging-api.retina.fm
      - HOST_MAP=staging-map.retina.fm
      - HOST_DASH=staging-dash.retina.fm
      - HOST_ADMIN=staging-admin.retina.fm
      - HOST_TESTAPI=staging-testapi.retina.fm
      - HOST_TESTMAP=staging-testmap.retina.fm
      - HOST_LEGACY_REDIRECT=staging-tower-finder.retina.fm
      # The only host-naming part of the CSP. wss://*.retina.fm already covers
      # both environments, so only the two explicit origins vary.
      - CSP_CONNECT_SRC=https://staging-api.retina.fm https://staging-admin.retina.fm wss://*.retina.fm
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G

  fleet:
    container_name: retina-staging-fleet
    environment:
      # Scoped to the Greenville, SC metro, and ~60% of prod's node count: the
      # staging droplet is smaller. This is the intended difference between the
      # two environments — everything else is meant to match.
      - FLEET_NODES=15
      - FLEET_REGIONS=us
      - FLEET_METRO=gvl
      - FLEET_N_CLUSTER=10
      - FLEET_N_CLUSTERS=1
      - FLEET_METRO_TRAFFIC_FRAC=0.85
      - FLEET_MODE=adsb
      # 15 nodes / 2.0s = 7.5 fps
      - FLEET_INTERVAL=2.0
      - FLEET_TIME_SCALE=1.0
      - FLEET_MIN_AIRCRAFT=10
      - FLEET_MAX_AIRCRAFT=20
      - FLEET_BEAM_WIDTH_DEG=0
      - FLEET_MAX_RANGE_KM=0
      - FLEET_CONCURRENCY=10
      - FLEET_CONNECT_RETRIES=10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
