# ── Staging Environment ──────────────────────────────────────────────────────
# Deploys server + fleet simulator with synthetic data.
# Used by CI to validate changes before production promotion.
#
# Usage:
#   docker compose -f docker-compose.staging.yml up -d --build
#   docker compose -f docker-compose.staging.yml logs -f
#   docker compose -f docker-compose.staging.yml down

services:
  # ── Main server: API + TCP + nginx ────────────────────────────────────────
  tower-finder:
    build: .
    container_name: retina-staging-server
    ports:
      - "80:80"
      - "443:443"
      - "3012:3012"
    volumes:
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    env_file:
      - backend/.env
    environment:
      - RETINA_ENV=staging
      - CORS_ORIGINS=https://staging.retina.fm,https://staging-api.retina.fm,https://staging-dash.retina.fm,https://staging-map.retina.fm
      - RADAR_TCP_PORT=3012
      - FRAME_WORKERS=6
      - FRAME_QUEUE_SIZE=10000
      # Bind the API on the compose network (port 8000 is NOT published in
      # `ports:`, so it stays off-host) so the fleet can POST ADS-B/ground-truth.
      - UVICORN_HOST=0.0.0.0
    command: ["/bin/sh", "/app/deploy/start.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Fleet simulator: synthetic radar nodes ────────────────────────────────
  fleet:
    build:
      context: .
      dockerfile: Dockerfile.fleet
    container_name: retina-staging-fleet
    depends_on:
      tower-finder:
        condition: service_healthy
    environment:
      - FLEET_NODES=50
      - FLEET_REGIONS=us
      # Spread the multi-node cluster budget across several inland metros so
      # multinode solves appear across the map (only tightly-clustered nodes
      # share overlap zones). Aircraft spawn near a random node, so making most
      # nodes cluster nodes (30/50) means most aircraft start in an overlap zone
      # → lively multinode across 5 metros. Same node count → same frame rate.
      - FLEET_N_CLUSTER=30
      - FLEET_N_CLUSTERS=5
      - FLEET_MODE=adsb
      - FLEET_INTERVAL=40.0
      - FLEET_TIME_SCALE=1.0
      - FLEET_MIN_AIRCRAFT=20
      - FLEET_MAX_AIRCRAFT=40
      - FLEET_BEAM_WIDTH_DEG=0
      - FLEET_MAX_RANGE_KM=0
      - FLEET_CONCURRENCY=10
      - FLEET_CONNECT_RETRIES=10
      - FLEET_HOST=tower-finder
      - FLEET_PORT=3012
      - FLEET_VALIDATE=false
      # HTTP base URL for live ADS-B / ground-truth pushes (the moving "truth"
      # tracks). Must point at the server over the compose network, not the
      # fleet's own localhost. Reaches uvicorn directly (UVICORN_HOST=0.0.0.0).
      - FLEET_VALIDATION_URL=http://tower-finder:8000
      - FLEET_SEED=42
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
