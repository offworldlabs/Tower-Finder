services:
  tower-finder:
    build: .
    # Pin an explicit image name, stable and independent of the Compose project
    # (directory) name. pre-deploy.sh + rollback.sh key the rollback on
    # `tower-finder:latest`; without the pin Compose auto-names it
    # `<dir>-tower-finder`, so rollback.sh retags an image Compose never runs and
    # silently restarts the bad build.
    image: tower-finder:latest
    ports:
      - "80:80"
      - "443:443"
      - "3012:3012"
    volumes:
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
      - backend-data:/app/backend/data
      - backend-coverage-data:/app/backend/coverage_data
    env_file:
      - backend/.env
    environment:
      # Bind uvicorn on 0.0.0.0 so the fleet container can POST live ADS-B /
      # ground-truth to the API over the compose network. Port 8000 is not in
      # `ports:`, so it stays off-host. Without this uvicorn binds 127.0.0.1 and
      # the fleet's pushes are refused. (Detections flow over the published TCP
      # port 3012.) Mirrors docker-compose.staging.yml.
      - UVICORN_HOST=0.0.0.0
      # Frame-processing thread pool. Production runs 8 (previously set only in
      # backend/.env, invisible to git); surfaced here so it is visible and
      # inheritable. Staging overrides this to 6.
      - FRAME_WORKERS=8
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Grace window for a cold boot (state/coverage warmup): failing checks
      # here don't count toward `retries` or flip the container `unhealthy`. It
      # gates the fleet's `depends_on: service_healthy` on a plain `docker
      # compose up`; the CI deploy starts the fleet with --no-deps and reboots
      # ignore depends_on, so it only stops a slow-but-fine boot aborting an `up`.
      start_period: 90s
    networks:
      - default
      - retina-edge

  # ── Fleet simulator: synthetic radar nodes + ground-truth aircraft ─────────
  # This is what makes testmap.retina.fm differ from map.retina.fm. It runs as a
  # Compose service rather than a host process so it restarts like the app: on
  # boot and via the CI `docker compose up -d --build`. It was previously started
  # out-of-band as a transient `systemd-run` unit, which lived only in runtime
  # memory and so did not survive reboots; that is how the fleet silently
  # vanished after the RAM-expansion reboot. Do not reintroduce a host-process
  # path: two fleets would both push and double-count nodes and aircraft.
  # Modeled on the `fleet` service in docker-compose.staging.yml, prod params.
  fleet:
    build:
      context: .
      dockerfile: Dockerfile.fleet
    # Pin an explicit image name (mirrors the app's) so pre-deploy/rollback can
    # save + retag a stable fleet image. Without it Compose auto-names it
    # `<dir>-fleet` and a rollback would leave the fleet on the bad deploy's
    # build while only the app reverted.
    image: tower-finder-fleet:latest
    container_name: retina-prod-fleet
    depends_on:
      tower-finder:
        condition: service_healthy
    # RADAR_API_KEY comes from backend/.env (same file the app loads). The prod
    # backend enforces X-API-Key on ingest whenever the key is set (radar.py), so
    # the fleet must present the matching key or its pushes 401. FLEET_* below
    # override .env (`environment` wins over `env_file`).
    env_file:
      - backend/.env
    environment:
      - FLEET_NODES=200
      - FLEET_REGIONS=us
      - FLEET_MODE=adsb
      - FLEET_INTERVAL=40.0
      - FLEET_TIME_SCALE=1.0
      - FLEET_MIN_AIRCRAFT=60
      - FLEET_MAX_AIRCRAFT=100
      - FLEET_BEAM_WIDTH_DEG=0
      - FLEET_MAX_RANGE_KM=0
      - FLEET_CONCURRENCY=20
      # `restart: unless-stopped` recovers the fleet if the app restarts, so the
      # script's 999-retry hack is gone; keep a healthy margin so a slow app
      # health-up can't drop the fleet mid-deploy.
      - FLEET_CONNECT_RETRIES=30
      - FLEET_HOST=tower-finder
      - FLEET_PORT=3012
      - FLEET_VALIDATE=false
      - FLEET_VALIDATION_URL=http://tower-finder:8000
      - FLEET_SEED=42
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  retina-edge:
    external: true

volumes:
  backend-data:
  backend-coverage-data:
