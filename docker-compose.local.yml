# ── Local override for the test stack ────────────────────────────────────────
# Runs docker-compose.test.yml (server + fleet simulator) on a laptop: no
# Cloudflare cert mount, no 443, HTTP on a high port. Everything else (image,
# fleet shape, resource limits, env) is inherited from the test compose file so
# this stays a faithful pre-deploy smoke check rather than a second config to
# maintain.
#
# Usage:
#   docker compose -f docker-compose.test.yml -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.test.yml -f docker-compose.local.yml logs -f
#   docker compose -f docker-compose.test.yml -f docker-compose.local.yml down
#
# Endpoints (nginx routing lives in deploy/nginx-local.conf, selected via
# NGINX_PROFILE=local; *.localhost resolves to 127.0.0.1):
#   http://testmap.localhost:8080  → React live-radar frontend (also plain localhost:8080)
#   http://testapi.localhost:8080  → API reverse proxy
#
# The fleet reaches the server over the compose network, so this publishes no
# host ports beyond 8080 and cannot clash with a concurrent `just up`.

services:
  tower-finder-test:
    ports: !override
      - "8080:80"
    # Same data volumes as the test stack, minus the /etc/ssl/cloudflare bind
    # mount (absent on a laptop; nginx-local.conf does not reference certs).
    volumes: !override
      - test-coverage-data:/app/backend/coverage_data
      - test-archive-data:/app/backend/coverage_data/archive
    # backend/.env holds deploy secrets (Maprad key) that the testmap does not
    # need; make it optional so a fresh clone can run this without `just setup`.
    env_file: !override
      - path: backend/.env
        required: false
    environment:
      # Leave RETINA_ENV=test (inherited from the base file): that is the
      # environment the droplet actually runs, so the backend behaves identically
      # here, and it stays inside the dev/test allowlists (JWT secret, auth
      # bypass) rather than tripping the production-only guards. The cert-free
      # nginx is selected on a separate axis so transport (plain HTTP) is not
      # entangled with the app environment.
      - NGINX_PROFILE=local
    # Don't resurrect the stack on every Docker Desktop start
    restart: "no"

  fleet-simulator:
    restart: "no"
