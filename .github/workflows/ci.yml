name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install ../libs/retina-geolocator ../libs/retina-tracker ../libs/retina-custody ../libs/retina-simulation ../libs/retina-analytics
      - name: Lint (ruff)
        run: ruff check .
      - name: Dead code (vulture)
        run: |
          vulture . vulture_whitelist.py \
            --min-confidence 60 \
            --exclude ".venv,tests,scripts,htmlcov,__pycache__" \
            --ignore-decorators "@router.*,@app.*" \
            --ignore-names "model_config,dispatch"
      - run: pytest tests/ -v --tb=short -m "not external"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Guards start.sh's nginx-profile selection, including the fail-closed
      # branch that refuses to serve the baked prod config for an unknown profile.
      - name: nginx-profile selection unit test
        run: bash deploy/tests/test_nginx_profile.sh
      - run: docker build -t tower-finder:ci .

  e2e-staging:
    name: Playwright E2E (staging)
    runs-on: ubuntu-latest
    needs: [staging-smoke-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (staging)
        run: E2E_ENV=staging npx playwright test
        env:
          CI: "true"
          RADAR_API_KEY: ${{ secrets.STAGING_RADAR_API_KEY }}

  e2e-prod:
    name: Playwright E2E (production)
    runs-on: ubuntu-latest
    needs: [production-smoke-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (production)
        run: E2E_ENV=prod npx playwright test
        env:
          CI: "true"
          RADAR_API_KEY: ${{ secrets.RADAR_API_KEY }}
      - name: Rollback production on E2E failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "E2E tests failed — rolling back production..."
            cd /opt/tower-finder && bash deploy/rollback.sh

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, dashboard-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: staging-deploy
      # Queue deploys instead of cancelling: a cancelled deploy can abort after
      # `git reset --hard` but before `docker compose up -d --build`, leaving the
      # box on fresh code with stale running containers (config/image changes
      # silently never take effect). Matches deploy-production.
      cancel-in-progress: false
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/tower-finder

            # Pre-flight: refuse to deploy when the disk is near full. Without
            # this, git fetch silently writes a partial pack, the source tree
            # never advances, and `docker compose --build` happily caches every
            # layer and "succeeds" with yesterday's image (run 25923117075).
            AVAIL_MB=$(df -m / | awk 'NR==2 {print $4}')
            if [ "${AVAIL_MB:-0}" -lt 2048 ]; then
              echo "::error::Staging disk only ${AVAIL_MB}MB free (< 2GB threshold). Aborting deploy."
              df -h /
              docker system df 2>/dev/null || true
              exit 1
            fi

            # Hard-reset rather than `git pull` — see the production deploy
            # block for the full incident description; same failure mode would
            # surface here if the staging server ever picked up a local commit.
            # `set -e` above guarantees a failed fetch/reset aborts the deploy.
            git fetch origin main
            git reset --hard origin/main
            git submodule update --init --recursive
            docker compose -f docker-compose.yml -f docker-compose.staging.yml down --timeout 30
            # Cap build cache at ~10GB (LRU eviction) rather than wiping it all:
            # keeps recent layers so incremental builds stay fast, and bounds
            # total size so cache growth can't trip the disk pre-flight above.
            # The stale-layer failure the old blanket wipe guarded against was
            # rooted in disk-full (partial git pack -> source never advanced ->
            # cache reused); the disk pre-flight now catches that root cause, so a
            # full wipe is redundant and only forced slow from-scratch rebuilds.
            docker builder prune -f --keep-storage 10GB
            # Deploy the app FIRST, on its own — building only `tower-finder`
            # means a broken Dockerfile.fleet can't abort the staging app deploy
            # (which would block the whole pipeline). Fleet is a separate step below.
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build tower-finder
            # Wait for server to become healthy (up to 90s)
            for i in $(seq 1 18); do
              if docker compose -f docker-compose.yml -f docker-compose.staging.yml exec -T tower-finder \
                python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null; then
                echo "Staging server healthy after ~$((i*5))s"
                break
              fi
              echo "Waiting for health check... attempt $i/18"
              sleep 5
              if [ "$i" = "18" ]; then
                echo "Staging health check failed after 90s"
                docker compose -f docker-compose.yml -f docker-compose.staging.yml logs --tail=50
                exit 1
              fi
            done
            # Now the fleet, separately — a fleet build/start failure surfaces
            # loudly here without taking the already-healthy app down with it.
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build --no-deps fleet

  staging-smoke-tests:
    name: Staging smoke tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for fleet to connect
        run: |
          echo "Waiting for fleet nodes to connect..."
          for i in $(seq 1 24); do
            COUNT=$(curl -sk https://${{ secrets.STAGING_HOST }}/api/test/dashboard \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['nodes']['active'])" 2>/dev/null) || COUNT=0
            if [ "${COUNT:-0}" -ge 1 ]; then
              echo "Fleet ready: ${COUNT} node(s) connected after ~$((i*5))s"
              break
            fi
            echo "Attempt $i/24: ${COUNT} nodes — waiting 5s..."
            sleep 5
          done
      - name: Run smoke tests against staging
        run: bash deploy/staging-smoke-test.sh

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Gate prod on BOTH the staging smoke tests and the full staging Playwright
    # E2E suite (`e2e-staging`). Previously only staging-smoke-tests gated this,
    # so the ~127-test E2E ran in parallel with the prod deploy and couldn't
    # stop a bad build reaching prod. This serialises the pipeline (E2E is now
    # on the critical path before prod) in exchange for real pre-prod coverage.
    needs: [staging-smoke-tests, e2e-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/tower-finder

            # Pre-deploy: save rollback image + git tag. NOT `|| true`: if we
            # cannot capture a rollback point, abort the deploy rather than ship
            # with no way back. A swallowed failure here previously let a deploy
            # proceed with a stale/absent rollback image, so a later rollback
            # silently restored the wrong build.
            bash deploy/pre-deploy.sh

            # Pre-flight: refuse to deploy when the disk is near full. Without
            # this, git fetch silently writes a partial pack ("No space left on
            # device"), the working tree never advances, and the subsequent
            # `docker compose --build` reuses every cached layer and "succeeds"
            # with yesterday's image (run 25923117075 — backend, frontend, and
            # dashboard were all stale).
            AVAIL_MB=$(df -m / | awk 'NR==2 {print $4}')
            if [ "${AVAIL_MB:-0}" -lt 2048 ]; then
              echo "::error::Production disk only ${AVAIL_MB}MB free (< 2GB threshold). Aborting deploy."
              df -h /
              docker system df 2>/dev/null || true
              exit 1
            fi

            # Hard-reset rather than `git pull`: the latter aborts silently on
            # divergent branches (deploy run 25481699738 — the server had a
            # local commit, pull printed a hint and exited 0, the build then
            # cached every layer because the source hadn't actually changed,
            # and the new bundle never made it to /app/dashboard/dist).
            # `set -e` above guarantees a failed fetch/reset aborts the deploy.
            git fetch origin main
            git reset --hard origin/main
            git submodule update --init --recursive
            pip3 install -e libs/retina-custody/ --break-system-packages --ignore-installed -q
            pip3 install -e libs/retina-simulation/ --break-system-packages -q
            # Cap build cache at ~10GB (LRU eviction) rather than wiping it all,
            # bounding total size so cache growth can't trip the disk pre-flight.
            # The stale-layer incident this guarded against (commit 01ca7f6) was
            # rooted in disk-full (partial git pack -> source never advanced ->
            # cache reused); the disk pre-flight above now catches that root
            # cause, so a full wipe is redundant and only forced slow from-scratch
            # rebuilds. 10GB leaves ample headroom on both droplets (>60GB free).
            docker builder prune -f --keep-storage 10GB
            # Deploy the app FIRST, on its own. Building only `tower-finder`
            # here means a broken Dockerfile.fleet can't abort the production
            # app deploy (the fleet is a separate step below, after health).
            docker compose up -d --build tower-finder

            # Wait for backend to become healthy (up to 90s — matches staging
            # and the healthcheck start_period; a cold boot can need >60s).
            for i in $(seq 1 18); do
              if docker compose exec -T tower-finder python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null; then
                echo "Deploy successful (healthy after ~$((i*5))s)"
                break
              fi
              echo "Waiting for health check... attempt $i/18"
              sleep 5
              if [ "$i" = "18" ]; then
                echo "Health check failed after 90s"
                docker compose logs --tail=50
                exit 1
              fi
            done

            # Now bring up the fleet simulator (Compose `fleet` service). This
            # is a SEPARATE step so a fleet build/start failure surfaces loudly
            # here — with the real error — but only AFTER the app above is
            # already deployed and healthy, so it can't take the app down with
            # it. --no-deps: the app is up already; don't let --build touch it.
            # The fleet has restart: unless-stopped, so unlike the old transient
            # systemd-run unit it also survives reboots. (RADAR_API_KEY reaches
            # it via backend/.env, the same file the app loads.)
            docker compose up -d --build --no-deps fleet

  production-smoke-tests:
    name: Production smoke tests
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for fleet to stabilize
        run: |
          # Require the active-node count to be ≥ MIN_NODES AND non-decreasing
          # for STABLE_TARGET consecutive checks before declaring the deploy
          # healthy. The previous version broke out on the first hit, which
          # let "flapping" deploys (nodes reconnect, then drop again) pass
          # smoke tests with a half-broken fleet.
          MIN_NODES=10
          STABLE_TARGET=3
          echo "Waiting 60s for fleet nodes to reconnect..."
          sleep 60
          stable=0
          last=0
          for i in $(seq 1 18); do
            COUNT=$(curl -sk https://${{ secrets.SERVER_HOST }}/api/test/dashboard \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['nodes']['active'])" 2>/dev/null) || COUNT=0
            if [ "${COUNT:-0}" -ge "$MIN_NODES" ] && [ "${COUNT:-0}" -ge "$last" ]; then
              stable=$((stable + 1))
              echo "Attempt $i/18: ${COUNT} nodes — stable ${stable}/${STABLE_TARGET}"
              if [ "$stable" -ge "$STABLE_TARGET" ]; then
                echo "Fleet stable at ${COUNT} nodes (≥${STABLE_TARGET} consecutive checks)"
                exit 0
              fi
            else
              echo "Attempt $i/18: ${COUNT} nodes (was ${last}) — resetting stability counter"
              stable=0
            fi
            last="${COUNT:-0}"
            sleep 10
          done
          echo "::error::Fleet did not stabilize at ≥${MIN_NODES} nodes after 60s + 18×10s"
          exit 1
      - name: Run production smoke tests
        id: smoke
        env:
          BASE_URL: https://api.retina.fm
        run: |
          CURL="curl -s --connect-timeout 10 --max-time 60"
          PASS=0; FAIL=0

          check_status() {
            local name="$1" url="$2" expected="$3"
            printf "  %-40s " "$name"
            # Retry once on connection error (transient load spikes during fleet reconnect)
            CODE=$($CURL -o /dev/null -w "%{http_code}" "$url" 2>/dev/null) \
              || CODE=$($CURL -o /dev/null -w "%{http_code}" "$url" 2>/dev/null) \
              || { echo "FAIL (connection)"; FAIL=$((FAIL+1)); return; }
            if [ "$CODE" = "$expected" ]; then echo "OK ($CODE)"; PASS=$((PASS+1)); else echo "FAIL ($CODE != $expected)"; FAIL=$((FAIL+1)); fi
          }

          echo "── Production Smoke Tests ──"
          check_status "GET /api/health"          "${BASE_URL}/api/health"            "200"
          check_status "GET /api/radar/nodes"     "${BASE_URL}/api/radar/nodes"       "200"
          check_status "GET /api/radar/analytics" "${BASE_URL}/api/radar/analytics"   "200"
          check_status "GET /api/test/dashboard"  "${BASE_URL}/api/test/dashboard"    "200"
          check_status "GET /api/test/mlat-verification" "${BASE_URL}/api/test/mlat-verification" "200"
          check_status "GET /api/config"          "${BASE_URL}/api/config"            "200"
          check_status "GET / (frontend)"         "https://towers.retina.fm/"         "200"
          check_status "GET /api/health (api.retina.fm)" "${BASE_URL}/api/health"     "200"

          # Wait for storage scan (background du task, 202 = still scanning)
          printf "  %-40s " "GET /api/admin/storage"
          for i in $(seq 1 24); do
            SCODE=$(curl -sk -o /dev/null -w "%{http_code}" "${BASE_URL}/api/admin/storage")
            if [ "$SCODE" = "200" ]; then echo "OK (200)"; PASS=$((PASS+1)); break; fi
            if [ "$SCODE" = "202" ] && [ "$i" = "24" ]; then echo "WARN (202 still scanning after 120s)"; PASS=$((PASS+1)); break; fi
            if [ "$i" = "24" ]; then echo "FAIL ($SCODE != 200 after 120s)"; FAIL=$((FAIL+1)); break; fi
            sleep 5
          done

          # Check aircraft data is flowing
          AIRCRAFT=$(curl -sk "${BASE_URL}/api/test/dashboard" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['pipeline']['aircraft_on_map'])" 2>/dev/null) || AIRCRAFT=0
          printf "  %-40s " "Aircraft on map > 0"
          if [ "${AIRCRAFT:-0}" -gt 0 ]; then echo "OK ($AIRCRAFT)"; PASS=$((PASS+1)); else echo "WARN ($AIRCRAFT — fleet may still be connecting)"; fi

          # Guard: active node count must not exceed 220 (multiple simultaneous fleets = 400+)
          NODES=$(curl -sk "${BASE_URL}/api/test/dashboard" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['nodes']['active'])" 2>/dev/null) || NODES=0
          printf "  %-40s " "Active nodes ≤ 220 (single fleet)"
          if [ "${NODES:-0}" -le 220 ]; then echo "OK ($NODES)"; PASS=$((PASS+1)); else echo "FAIL ($NODES > 220 — multiple fleet simulators may be running)"; FAIL=$((FAIL+1)); fi

          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ] || exit 1
      # Auto-rollback on smoke failure, mirroring the prod E2E job. A failed
      # smoke test means a bad build is live serving prod; revert to
      # last-known-good rather than leaving it up for a human to catch. The
      # stabilise loop above (3 consecutive stable checks) guards against a
      # transient fleet-reconnect flap tripping this. The condition is scoped to
      # the smoke step's own outcome, so a stabilise-loop timeout fails the job
      # for a human to inspect without triggering an automatic rollback.
      - name: Rollback production on smoke-test failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Production smoke tests failed — rolling back production..."
            cd /opt/tower-finder && bash deploy/rollback.sh
