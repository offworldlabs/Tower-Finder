name: CI

on:
  push:
    branches: [main]
  # No base-branch filter. `branches:` on pull_request matches the PR's BASE, so
  # a PR stacked on a feature branch ran none of the jobs below while still
  # showing a green claude-review tick, which reads as a pass. What wants testing
  # is the head; where it is aimed is irrelevant.
  # `edited` is not in the default set (`opened`, `synchronize`, `reopened`) and
  # is the action a base-branch change arrives as. Without it, a PR retargeted
  # when its parent merges keeps the tick it earned against the old base and is
  # never validated against the new one, which is the second half of the trap
  # the base filter opened. The jobs below discard the title and body edits that
  # come with it.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # So a branch can be run on demand, which was otherwise impossible.
  workflow_dispatch:

# Testing every PR regardless of base would otherwise multiply CI minutes: this
# cancels superseded runs on the same PR ref. Push-to-main runs (and manual
# workflow_dispatch runs) get a group unique to their own run_id instead, since
# the deploy jobs below hang off them and a half-run deploy is worse than a slow
# one: they are never cancelled, and (unlike a group shared with other runs on
# the same ref) they never queue behind an earlier run either. The deploy jobs'
# own job-level concurrency groups are what serialise deploys.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-pull_request-{1}', github.workflow, github.ref) || format('ci-{0}-{1}-{2}', github.workflow, github.event_name, github.run_id) }}
  # Same condition the jobs carry, and for a sharper reason. Cancellation happens
  # when the new run is created, before any job-level `if:` is evaluated, so a
  # title edit would otherwise cancel a real run mid-flight and then skip every
  # job in the run that replaced it, leaving the PR with no signal at all. A
  # no-op edit queues instead, and skips quickly once it starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) }}

env:
  # Single definition of the deploy directory. The ssh-action script blocks
  # below interpolate it, so moving the directory is one edit here. It is also
  # forwarded to the droplet (`envs: APP_DIR`), because deploy/pre-deploy.sh and
  # deploy/rollback.sh cd to an APP_DIR of their own and would otherwise fall
  # back to a default still naming the old directory, snapshotting and rolling
  # back a tree nothing is served from.
  APP_DIR: /opt/tower-finder

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    defaults:
      run:
        working-directory: backend
    # Job-wide rather than on the pytest step alone, so the step below that
    # asserts the core and the step that relies on it cannot end up reading
    # different environments: a guard that sets its own is no guard at all.
    # Steps that never invoke coverage are indifferent to it.
    env:
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install ../libs/retina-geolocator ../libs/retina-tracker ../libs/retina-custody ../libs/retina-simulation ../libs/retina-analytics
      # working-directory overrides the job default of `backend`: pre-commit
      # reads .pre-commit-config.yaml from the repo root. args: [backend] in
      # that config is what scopes both ops hooks.
      - name: Lint (pre-commit)
        working-directory: .
        run: pre-commit run --all-files --show-diff-on-failure
      # The node API's wire contract is generated from the routes, not authored,
      # so this is what makes it trustworthy: the committed file cannot be
      # hand-edited to match a change, because the next run regenerates it and
      # notices. Ahead of pytest, which asserts the same thing, because a
      # dedicated step names the remediation instead of burying it in a diff.
      #
      # RETINA_ENV because importing the app outside a test process otherwise
      # resolves as production, which refuses to start without its secrets.
      - name: Node API contract is current
        env:
          RETINA_ENV: dev
        run: python -m scripts.generate_openapi --check
      # When coverage cannot honour COVERAGE_CORE it warns and uses the C tracer
      # anyway, and one warning is invisible among the hundreds pytest prints, so
      # both the speed and the greenlet fix below could regress with nothing
      # failing. Enabling branch coverage is the realistic way to cause that
      # before CPython 3.14, sys.monitoring having no branch events until then.
      # Assert the core rather than assume it. Nothing public reports which core
      # is live, hence the private _collector; if a coverage bump moves it, say
      # so plainly rather than failing every PR on a bare AttributeError.
      - name: Coverage measures through sys.monitoring
        run: |
          python - <<'PY'
          import coverage

          cov = coverage.Coverage()  # picks up [tool.coverage.run] from pyproject.toml
          cov.start()
          cov.stop()
          try:
              core = cov._collector.tracer_name()
          except AttributeError as exc:
              raise SystemExit(
                  f"cannot tell which coverage core is live ({exc}). This check reads a "
                  f"private attribute and coverage {coverage.__version__} appears to have "
                  "moved it, so the check needs updating; the pytest step's measurement is "
                  "not necessarily wrong."
              ) from exc
          if core != "SysMonitor":
              raise SystemExit(
                  f"coverage chose the {core} core despite COVERAGE_CORE=sysmon. Most likely "
                  "branch coverage is now on in [tool.coverage.run], which sys.monitoring "
                  "cannot measure before CPython 3.14. Left alone, the step below would "
                  "quietly return to the slower tracer and to under-reporting the async "
                  "route modules."
              )
          print(f"coverage core: {core}")
          PY
      # COVERAGE_CORE=sysmon, set job-wide above, is what makes this step quick.
      # coverage.py's default C tracer hooks sys.settrace, which fires per line
      # executed and drops the frame out of CPython's specialising fast paths;
      # sysmon is the PEP 669 backend, which disables each location once it has
      # been seen, so a line costs once rather than once per execution. This is
      # the longest job in the run by several minutes and every deploy waits on
      # it, so the tracing overhead is worth reclaiming.
      #
      # It also raises the reported total by about a point, and that is the more
      # useful half. settrace measures per execution context, so lines resumed in
      # a greenlet after an `await session.…` counted as unrun: the async route
      # modules were being reported as less tested than they are. sys.monitoring
      # is interpreter-global and sees them wherever they resume. Checked against
      # `concurrency = ["thread", "greenlet"]` on routes/node_stream.py, the two
      # recover the same lines, and sysmon does it at a fraction of that
      # setting's cost. ONBOARDING, "Running tests", covers what this means for a
      # local figure that does not match this one.
      - run: pytest tests/ -v --tb=short -m "not external"

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker build -t tower-finder:ci .

  env-parity:
    name: Staging/production parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Both services declare `env_file: backend/.env`, which holds per-host
      # secrets and so is never committed. `docker compose config` refuses to
      # resolve without it, so stand in an empty one — the check compares the
      # two overlays against each other and reads nothing out of it.
      - name: Stub backend/.env for compose resolution
        run: touch backend/.env
      # Staging only protects production while the two stay the same everywhere
      # that isn't hostnames or the simulator. This fails the build on any other
      # difference — in the compose merge or in the rendered nginx config —
      # naming the exact key so it can't be added by accident.
      - name: Check compose + nginx parity
        run: python3 deploy/check-env-parity.py

  playwright-image:
    name: Resolve the Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # The tag is DERIVED from the lockfile rather than written out here, so
      # the browsers baked into the container cannot disagree with the client
      # that drives them. Bumping Playwright is an npm operation and nothing
      # else; there is deliberately no version string in this file to forget.
      #
      # The lockfile, not package.json: the latter carries a range (^1.59.1)
      # and `npm ci` installs whatever the lock resolved. Only the lock states
      # what will actually run.
      #
      # This job has no `if:` gate on push-to-main, unlike the two E2E jobs
      # that consume it. That is the point of the verify below — see there.
      - name: Resolve and verify
        id: resolve
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version")
          IMAGE="mcr.microsoft.com/playwright:v${VERSION}-noble"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          # A derived tag cannot be stale, but it can name an image that was
          # never published — Microsoft does not necessarily ship one for every
          # patch release. Checked HERE, on the pull request, because the jobs
          # that pull it only run on push to main: without this, an unpublished
          # version surfaces as a container-pull failure after the merge, with
          # nothing pointing at the lockfile bump that caused it.
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::${IMAGE} does not exist in the registry. frontend/package-lock.json resolves @playwright/test to ${VERSION}, and no Playwright container image was published for it. Pin the lockfile to a release that has one."
            exit 1
          fi
          echo "Resolved and verified ${IMAGE}"

  e2e-staging:
    name: Playwright E2E (staging)
    runs-on: ubuntu-latest
    # Only the pull and npm ci sit outside the test step's own cap now, and an
    # image pull is minutes at worst. See the production job for why the job
    # cap is a backstop rather than the primary bound.
    timeout-minutes: 30
    needs: [staging-smoke-tests, playwright-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The browsers and their shared libraries ship in the image, so there is no
    # install step and neither apt nor Playwright's CDN is in this path. Both
    # broke repeatedly on 2026-08-18 and 2026-08-19; see the production job.
    container:
      image: ${{ needs.playwright-image.outputs.image }}
    # `npm ci` runs @playwright/test's postinstall, which fetches browsers. The
    # image sets PLAYWRIGHT_BROWSERS_PATH=/ms-playwright and the tag is derived
    # to match the lockfile, so it finds the right revision already there and
    # does nothing. This makes that a guarantee rather than an expectation: if
    # the browsers were ever NOT found, the postinstall would quietly download
    # them from the CDN this job exists to avoid, and the only symptom would be
    # a slow green run. With this set it fails loudly at the browser instead,
    # pointing at the cause. See microsoft/playwright#4283.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Kept despite the image shipping its own Node: this pins the version the
      # tests run under to the same 20 as every other job, rather than letting
      # it drift with whatever the Playwright image happens to carry, and keeps
      # the npm cache. Only browser provisioning changes here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Run E2E tests (staging)
        timeout-minutes: 15
        run: E2E_ENV=staging npx playwright test
        env:
          CI: "true"
          RADAR_API_KEY: ${{ secrets.STAGING_RADAR_API_KEY }}

  e2e-prod:
    name: Playwright E2E (production)
    runs-on: ubuntu-latest
    # A backstop above the test step's own cap, not the primary bound: a job
    # timeout is a cancellation and would skip the rollback below, whereas the
    # step cap marks the step failed and keeps it reachable.
    timeout-minutes: 30
    needs: [production-smoke-tests, playwright-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The browsers and their shared libraries ship in the image, so there is no
    # install step at all. That step was the single worst source of red runs
    # here: `npx playwright install --with-deps` fetches the browsers from
    # Playwright's CDN, which stalled twice on 2026-08-18, and before that runs
    # an apt update, which hung for 14m34s against the runner's dead
    # azure.archive.ubuntu.com mirror on both 2026-08-18 and 2026-08-19.
    #
    # It also mattered more here than anywhere else: under the old gating an
    # install that exited non-zero satisfied `failure()` and rolled a healthy
    # production back. Removing the step removes that class of event rather
    # than only declining to act on it.
    container:
      image: ${{ needs.playwright-image.outputs.image }}
    # See the staging job: makes the postinstall's no-op a guarantee.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # See the staging job for why setup-node is kept inside the container.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      # Bounded at the step rather than relying on the job cap: a step timeout
      # marks the step failed, which still trips the rollback below, whereas a
      # job timeout is a cancellation and would skip it. A production wedged
      # badly enough to hang Playwright is exactly when the rollback is wanted.
      - name: Run E2E tests (production)
        id: e2e
        timeout-minutes: 15
        run: E2E_ENV=prod npx playwright test
        env:
          CI: "true"
          RADAR_API_KEY: ${{ secrets.RADAR_API_KEY }}
      # Scoped to the test step's own outcome, as the production smoke job is.
      # A bare failure() also fires when the container fails to pull, or when
      # checkout or npm ci fails, none of which say anything about whether
      # production is healthy. The browser install that made this urgent is
      # gone, but the reasoning outlives it: anything that breaks before the
      # tests run is a statement about the runner, not about production. An
      # infrastructure failure now leaves the job red for a human to read,
      # and only tests that ran and
      # failed roll production back.
      - name: Rollback production on E2E failure
        if: failure() && steps.e2e.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR
          script: |
            # Same identity assertion the deploy carries, and for a stronger
            # reason: rollback.sh resets the tree, retags images over :latest and
            # cycles the stack, so a SERVER_HOST pointed at the wrong droplet
            # does more damage here than a deploy would. Inline rather than in
            # rollback.sh itself, so it holds even when the box is checked out at
            # a tree that predates the script. See deploy-production for why the
            # match is exact.
            [ "$(hostname)" = "retina-prod" ] || { echo "::error::Refusing to roll back on '$(hostname)' — expected retina-prod."; exit 1; }
            echo "E2E tests failed — rolling back production..."
            cd ${{ env.APP_DIR }} && bash deploy/rollback.sh

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-tests, frontend-build, dashboard-build, docker-build, env-parity]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: staging-deploy
      # Queue deploys instead of cancelling: a cancelled deploy can abort after
      # `git reset --hard` but before `docker compose up -d --build`, leaving the
      # box on fresh code with stale running containers (config/image changes
      # silently never take effect). Matches deploy-production.
      cancel-in-progress: false
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 20m
          envs: APP_DIR
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            # Same two wrong-environment checks production runs, first and in the
            # same order, for the same reasons. The hostname is the only signal
            # that holds on a box with no .env at all, which is exactly the state
            # a droplet awaiting its first deploy is in; see the production block
            # for why it is an exact match rather than a pattern.
            if [ "$(hostname)" != "retina-staging" ]; then
              echo "::error::Refusing to deploy staging onto '$(hostname)' — expected retina-staging. If this droplet was rebuilt, finish provisioning it (hostnamectl set-hostname retina-staging); otherwise this job is pointed at the wrong box."
              exit 1
            fi

            # A .env naming another environment means this job is pointed
            # at a box it does not own. Without this the write further down simply
            # takes that box over — overwriting its .env and running `down` then
            # `up` would bring production back on staging's hostnames, fleet size
            # and container names. A MISSING .env is allowed through; that is the
            # normal state of a box awaiting its first deploy, and we write it
            # below.
            if [ -f .env ] && ! grep -q '^COMPOSE_FILE=.*docker-compose\.staging\.yml' .env; then
              echo "::error::${{ env.APP_DIR }}/.env exists but does not select the staging overlay — this host is not staging. Inspect it; do not deploy."
              exit 1
            fi

            # Pre-flight: Cloudflare's origin-pull CA, checked BEFORE anything
            # stops or rebuilds the stack. nginx renders `ssl_verify_client on`
            # (deploy/nginx/snippets/tls.conf) and start.sh refuses to boot
            # without the CA, so on a droplet where the human half of this work
            # is not done — enable Authenticated Origin Pulls for the zone, put
            # the CA on the box — a deploy would run `docker compose down`,
            # rebuild, fail to start, and leave the environment DOWN. Refusing
            # here converts that outage into a refused deploy: everything above
            # this line only reads the box.
            CF_CA=/etc/ssl/cloudflare/origin-pull-ca.pem
            if [ ! -f "$CF_CA" ]; then
              echo "::error::${CF_CA} is missing on $(hostname). nginx requires Cloudflare's origin-pull CA and will not start without it. Enable Authenticated Origin Pulls for the zone, then fetch the CA onto this droplet (curl -fsS --create-dirs -o ${CF_CA} https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem) and re-run. Refusing to deploy; the running stack is untouched."
              exit 1
            fi
            if ! openssl x509 -in "$CF_CA" -noout >/dev/null 2>&1; then
              echo "::error::${CF_CA} exists on $(hostname) but is not a parseable PEM certificate — a truncated download or an error page saved to the path would look exactly like this. nginx would fail to start. Replace it and re-run. Refusing to deploy; the running stack is untouched."
              exit 1
            fi
            echo "Origin-pull CA present and parseable: ${CF_CA}"

            # Pre-flight: refuse to deploy when the disk is near full. Without
            # this, git fetch silently writes a partial pack, the source tree
            # never advances, and `docker compose --build` happily caches every
            # layer and "succeeds" with yesterday's image (run 25923117075).
            AVAIL_MB=$(df -m / | awk 'NR==2 {print $4}')
            if [ "${AVAIL_MB:-0}" -lt 2048 ]; then
              echo "::error::Staging disk only ${AVAIL_MB}MB free (< 2GB threshold). Aborting deploy."
              df -h /
              docker system df 2>/dev/null || true
              exit 1
            fi

            # Hard-reset rather than `git pull` — see the production deploy
            # block for the full incident description; same failure mode would
            # surface here if the staging server ever picked up a local commit.
            # `set -e` above guarantees a failed fetch/reset aborts the deploy.
            git fetch origin main
            git reset --hard origin/main
            git submodule update --init --recursive
            # The host's ./.env sets COMPOSE_FILE (base + staging overlay), so
            # every command below is character-identical to the production deploy
            # block. Written from the tree we just checked out rather than assumed
            # to be present: this job knows perfectly well which environment it is
            # deploying, so making that depend on someone having copied the right
            # file by hand only creates a way to get it wrong. A rebuilt droplet,
            # a restored snapshot or a hand-mangled file now self-heals here.
            cp deploy/env.staging.example .env
            docker compose down --timeout 30
            # Cap build cache at ~10GB (LRU eviction) rather than wiping it all:
            # keeps recent layers so incremental builds stay fast, and bounds
            # total size so cache growth can't trip the disk pre-flight above.
            # The stale-layer failure the old blanket wipe guarded against was
            # rooted in disk-full (partial git pack -> source never advanced ->
            # cache reused); the disk pre-flight now catches that root cause, so a
            # full wipe is redundant and only forced slow from-scratch rebuilds.
            docker builder prune -f --keep-storage 10GB
            # Deploy the app FIRST, on its own — building only `tower-finder`
            # means a broken Dockerfile.fleet can't abort the staging app deploy
            # (which would block the whole pipeline). Fleet is a separate step below.
            docker compose up -d --build tower-finder
            # Wait for server to become healthy (up to 90s)
            for i in $(seq 1 18); do
              if docker compose exec -T tower-finder \
                python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null; then
                echo "Staging server healthy after ~$((i*5))s"
                break
              fi
              echo "Waiting for health check... attempt $i/18"
              sleep 5
              if [ "$i" = "18" ]; then
                echo "Staging health check failed after 90s"
                docker compose logs --tail=50
                exit 1
              fi
            done
            # Now the fleet, separately — a fleet build/start failure surfaces
            # loudly here without taking the already-healthy app down with it.
            docker compose up -d --build --no-deps fleet

  staging-smoke-tests:
    name: Staging smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4
      # The curls in this loop carry no --max-time, so against a hung origin
      # the 24 iterations run far past the job cap. Bounded here rather than by
      # rewriting the loop, which deploy/staging-smoke-test.sh mirrors.
      - name: Wait for fleet to connect
        timeout-minutes: 10
        run: |
          echo "Waiting for fleet nodes to connect..."
          # Through the edge, not at the droplet's address: the origin now requires
          # Cloudflare's client certificate (ssl_verify_client in
          # deploy/nginx/snippets/tls.conf) and the DOCKER-USER boundary drops
          # anything on 443 that is not from a Cloudflare range, so a direct-to-IP
          # request can only ever time out or 400. `-k` does not help — that flag
          # governs verification of the SERVER's certificate, not presentation of
          # a client one. Same hostname deploy/staging-smoke-test.sh uses for this
          # endpoint (BASE_URL there), so both agree on what "staging" means.
          for i in $(seq 1 24); do
            COUNT=$(curl -s https://staging-towers.retina.fm/api/test/dashboard \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['nodes']['active'])" 2>/dev/null) || COUNT=0
            if [ "${COUNT:-0}" -ge 1 ]; then
              echo "Fleet ready: ${COUNT} node(s) connected after ~$((i*5))s"
              break
            fi
            echo "Attempt $i/24: ${COUNT} nodes — waiting 5s..."
            sleep 5
          done
      - name: Run smoke tests against staging
        timeout-minutes: 15
        run: bash deploy/staging-smoke-test.sh

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Above the ssh-action's own command_timeout below, so a stuck deploy
    # surfaces as that step's error rather than as a bare job timeout.
    timeout-minutes: 30
    # Gate prod on BOTH the staging smoke tests and the full staging Playwright
    # E2E suite (`e2e-staging`). Previously only staging-smoke-tests gated this,
    # so the ~127-test E2E ran in parallel with the prod deploy and couldn't
    # stop a bad build reaching prod. This serialises the pipeline (E2E is now
    # on the critical path before prod) in exchange for real pre-prod coverage.
    needs: [staging-smoke-tests, e2e-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          envs: APP_DIR
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            # Identity pre-flight, and deliberately the first thing of all: it is
            # the only check here that does not depend on the state of the box.
            # The .env check below cannot catch a droplet that has never been
            # deployed to, because such a box has no .env and absence has to be
            # allowed through (see below) — but it still knows its own name.
            #
            # An exact match rather than a pattern, because substring matching on
            # environment names is a trap: `latest`, `testnet` and `contest` all
            # contain `test`, so a droplet named retina-prod-latest or sitting
            # under a *.testnet. domain would be refused as if it were the test
            # box. setup-server.sh sets this name from RETINA_TARGET_ENV, so a
            # fully provisioned droplet always satisfies it; anything else is
            # either the wrong box or a rebuild that never finished, and neither
            # should take a production deploy.
            if [ "$(hostname)" != "retina-prod" ]; then
              echo "::error::Refusing to deploy production onto '$(hostname)' — expected retina-prod. If this droplet was rebuilt, finish provisioning it (hostnamectl set-hostname retina-prod); otherwise this job is pointed at the wrong box."
              exit 1
            fi

            # Checked immediately after identity, and for a similar reason: if
            # this box is still mid-deploy from an earlier run, none of the
            # questions below it are worth asking.
            #
            # The marker is written after pre-deploy.sh and cleared when the app
            # comes back healthy or a rollback succeeds. This run has not written
            # one yet, so finding one here means an earlier attempt was left half
            # deployed and never recovered — its rollback failed, or the run was
            # cancelled before one could.
            #
            # Deploying over that would destroy the only way back. pre-deploy.sh
            # snapshots the CURRENTLY RUNNING container as the new rollback
            # point, so it would capture the broken build, discard the good one,
            # and then the marker write would overwrite the evidence too. The
            # next rollback would faithfully restore the breakage.
            #
            # Deliberately ANY marker rather than one from another run: "Re-run
            # failed jobs" keeps the same run id, and a retry poisons the
            # snapshot exactly as a fresh run would.
            #
            # The cost is that an incident which leaves a marker behind also
            # blocks deploys until a human clears it. That is the intended
            # trade: the box is in an unknown state and its rollback point is
            # the thing at risk.
            if [ -f .deploy-in-progress ]; then
              echo "::error::${{ env.APP_DIR }}/.deploy-in-progress is still present on $(hostname) ($(cat .deploy-in-progress)). An earlier deploy was left mid-flight and never confirmed healthy — its rollback failed, or was cancelled before it ran. Deploying now would snapshot the broken container as the new rollback point and lose the good one. Inspect the box and recover it (bash deploy/rollback.sh, or fix forward), then delete the marker and re-run. Refusing to deploy; the running stack is untouched."
              exit 1
            fi

            # Second pre-flight, before anything below mutates the box: a .env
            # naming the WRONG environment is the one remaining error that has to
            # be caught before pre-deploy.sh runs. That script
            # reads the current image through `docker compose images`, so it
            # resolves through whatever this file says; staging's .env here would
            # have it snapshot the wrong service and then deploy production onto
            # staging's hostnames, fleet and container names.
            #
            # A MISSING .env is deliberately allowed through. It used to be a hard
            # refusal, which turned out to be unshippable: production has never had
            # one, and the file it would name (docker-compose.prod.yml) does not
            # exist in the tree production is currently checked out at — it arrives
            # with the git reset below. Refusing here meant the deploy could never
            # run, and writing the file by hand beforehand was worse: compose would
            # then resolve against an overlay that is not there yet, pre-deploy.sh
            # would warn "no running image found" and carry on, and the largest
            # deploy this box has taken would have gone out with no rollback point.
            # With no .env at all, compose resolves the base alone, which is
            # exactly production's current config, so the snapshot is correct.
            #
            # The file is then written from the checked-out tree, below.
            if [ -f .env ] && ! grep -q '^COMPOSE_FILE=.*docker-compose\.prod\.yml' .env; then
              echo "::error::${{ env.APP_DIR }}/.env exists but does not select the production overlay — it names another environment. Inspect it; do not deploy."
              exit 1
            fi

            # Third pre-flight: the two secrets that production cannot boot
            # without, again before anything mutates the box.
            # docker-compose.prod.yml names this environment `production`, and
            # under that name backend/core/users.py and backend/routes/test.py
            # each raise at import time when their secret is unset. The failure
            # would be a crash-looping container, and the rollback steps hang off
            # the smoke and E2E jobs, which are skipped when this job fails — so
            # an unset secret leaves production down until a human SSHes in. A
            # refused deploy is the better outcome.
            #
            # Both are checked, because both fail the same way: RADAR_API_KEY is
            # set on the box today, so only JWT_SECRET was at risk on the deploy
            # that introduced this, but a guard that covers one of a matched pair
            # invites the other to rot.
            #
            # JWT_SECRET carries a length bound as well, to reject the
            # placeholder in backend/.env.example, which is published in this
            # repo and would otherwise satisfy a mere presence check.
            # Both read the LAST matching line rather than any of them, because
            # that is the one that reaches the container: compose's env_file
            # takes last-occurrence-wins on a repeated key. The remediation
            # below tells an operator to append, so a duplicate is the likely
            # shape of a botched rotation, and checking any line would pass on
            # the old value while the app booted with the new one.
            if ! grep -E '^JWT_SECRET=' backend/.env 2>/dev/null | tail -1 | grep -qE '^JWT_SECRET=.{32,}$'; then
              echo "::error::backend/.env has no effective JWT_SECRET of at least 32 characters, and production refuses to boot without one (backend/core/users.py). On the droplet, replacing any existing line: printf 'JWT_SECRET=%s\n' \"\$(openssl rand -hex 32)\" >> ${{ env.APP_DIR }}/backend/.env"
              exit 1
            fi
            if ! grep -E '^RADAR_API_KEY=' backend/.env 2>/dev/null | tail -1 | grep -qE '^RADAR_API_KEY=.+$'; then
              echo "::error::backend/.env has no effective RADAR_API_KEY, and production refuses to boot without one (backend/routes/test.py), which would also take /api/test/dashboard with it."
              exit 1
            fi

            # Pre-flight: Cloudflare's origin-pull CA, checked BEFORE anything
            # stops or rebuilds the stack. nginx renders `ssl_verify_client on`
            # (deploy/nginx/snippets/tls.conf) and start.sh refuses to boot
            # without the CA, so on a droplet where the human half of this work
            # is not done — enable Authenticated Origin Pulls for the zone, put
            # the CA on the box — the rebuild below would fail to start and
            # leave production DOWN. It would also not roll back: both rollback
            # paths are gated on the smoke/E2E jobs, and those are skipped when
            # this job itself fails. Refusing here converts that outage into a
            # refused deploy; everything above this line only reads the box.
            #
            # Staging carries the identical check, but staging passing proves
            # nothing about this droplet — the CA is per-box state, not
            # something the pipeline ships.
            CF_CA=/etc/ssl/cloudflare/origin-pull-ca.pem
            if [ ! -f "$CF_CA" ]; then
              echo "::error::${CF_CA} is missing on $(hostname). nginx requires Cloudflare's origin-pull CA and will not start without it. Enable Authenticated Origin Pulls for the zone, then fetch the CA onto this droplet (curl -fsS --create-dirs -o ${CF_CA} https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem) and re-run. Refusing to deploy; the running stack is untouched."
              exit 1
            fi
            if ! openssl x509 -in "$CF_CA" -noout >/dev/null 2>&1; then
              echo "::error::${CF_CA} exists on $(hostname) but is not a parseable PEM certificate — a truncated download or an error page saved to the path would look exactly like this. nginx would fail to start. Replace it and re-run. Refusing to deploy; the running stack is untouched."
              exit 1
            fi
            echo "Origin-pull CA present and parseable: ${CF_CA}"

            # Pre-flight: refuse to deploy when the disk is near full. Without
            # this, git fetch silently writes a partial pack ("No space left on
            # device"), the working tree never advances, and the subsequent
            # `docker compose --build` reuses every cached layer and "succeeds"
            # with yesterday's image (run 25923117075 — backend, frontend, and
            # dashboard were all stale).
            AVAIL_MB=$(df -m / | awk 'NR==2 {print $4}')
            if [ "${AVAIL_MB:-0}" -lt 2048 ]; then
              echo "::error::Production disk only ${AVAIL_MB}MB free (< 2GB threshold). Aborting deploy."
              df -h /
              docker system df 2>/dev/null || true
              exit 1
            fi

            # Pre-deploy: save rollback image + git tag. NOT `|| true`: if we
            # cannot capture a rollback point, abort the deploy rather than ship
            # with no way back. A swallowed failure here previously let a deploy
            # proceed with a stale/absent rollback image, so a later rollback
            # silently restored the wrong build.
            bash deploy/pre-deploy.sh

            # From here on the box is mid-deploy: a rollback point now exists,
            # and everything below moves the tree or the running containers.
            # The marker is what lets the rollback job tell "died in a
            # pre-flight, stack untouched" from "died with production half
            # deployed" — the two need opposite responses.
            #
            # Every check that can refuse the deploy sits ABOVE this line, which
            # is the property the rollback job depends on. The disk pre-flight
            # used to sit below it; it refuses without touching anything, so a
            # full disk would have been read as a half-finished deploy and cost
            # production a needless down/up cycle. Keep new pre-flights above.
            #
            # The run id is not decoration: the rollback job refuses to act on a
            # marker written by a different run, because that means an earlier
            # deploy was left mid-flight and never recovered.
            echo "run ${{ github.run_id }} started $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              > ${{ env.APP_DIR }}/.deploy-in-progress

            # Hard-reset rather than `git pull`: the latter aborts silently on
            # divergent branches (deploy run 25481699738 — the server had a
            # local commit, pull printed a hint and exited 0, the build then
            # cached every layer because the source hadn't actually changed,
            # and the new bundle never made it to /app/dashboard/dist).
            # `set -e` above guarantees a failed fetch/reset aborts the deploy.
            git fetch origin main
            git reset --hard origin/main
            git submodule update --init --recursive

            # Select the production overlay, now that the reset has actually put
            # docker-compose.prod.yml on disk. This must sit after the reset and
            # before the first compose command below — the whole chicken-and-egg
            # is that the file naming the overlay is useless until the overlay
            # exists. pre-deploy.sh above has already taken its snapshot against
            # the previous config, which is what a rollback needs to restore.
            cp deploy/env.prod.example .env

            pip3 install -e libs/retina-custody/ --break-system-packages --ignore-installed -q
            pip3 install -e libs/retina-simulation/ --break-system-packages -q
            # Cap build cache at ~10GB (LRU eviction) rather than wiping it all,
            # bounding total size so cache growth can't trip the disk pre-flight.
            # The stale-layer incident this guarded against (commit 01ca7f6) was
            # rooted in disk-full (partial git pack -> source never advanced ->
            # cache reused); the disk pre-flight above now catches that root
            # cause, so a full wipe is redundant and only forced slow from-scratch
            # rebuilds. 10GB leaves ample headroom on both droplets (>60GB free).
            docker builder prune -f --keep-storage 10GB
            # Deploy the app FIRST, on its own. Building only `tower-finder`
            # here means a broken Dockerfile.fleet can't abort the production
            # app deploy. Production runs no fleet simulator (see the `sim`
            # profile in docker-compose.prod.yml), so `tower-finder` is the
            # whole of the production deploy; staging still builds both.
            docker compose up -d --build tower-finder

            # Wait for backend to become healthy (up to 90s — matches staging
            # and the healthcheck start_period; a cold boot can need >60s).
            for i in $(seq 1 18); do
              if docker compose exec -T tower-finder python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null; then
                echo "Deploy successful (healthy after ~$((i*5))s)"
                break
              fi
              echo "Waiting for health check... attempt $i/18"
              sleep 5
              if [ "$i" = "18" ]; then
                echo "Health check failed after 90s"
                docker compose logs --tail=50
                exit 1
              fi
            done

            # Reached only by the loop's `break`, i.e. the app answered
            # /api/health. The box is no longer mid-deploy, so drop the marker;
            # any failure after this point is a smoke/E2E failure, which the
            # rollback steps on those jobs already cover.
            rm -f ${{ env.APP_DIR }}/.deploy-in-progress

  rollback-production-on-deploy-failure:
    name: Roll back production if the deploy failed after it began
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-production]
    # Same group as deploy-production. The slot frees the moment that job ends,
    # so without this a following push's deploy can be inside `git reset --hard`
    # and `docker compose up --build` in the deploy directory while rollback.sh
    # is running `git reset --hard` and `docker compose down` in the same
    # directory. Serialising can delay a rollback behind a queued deploy, which
    # is the lesser problem: that deploy takes its own snapshot and supersedes
    # the rollback, whereas two writers in one directory corrupts both.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # `always() && ...result == 'failure'` rather than a bare `failure()`.
    # failure() is true when ANY ancestor job failed, and deploy-production has
    # ancestors: an e2e-staging failure skips the deploy entirely, and this job
    # would then SSH into production to consider rolling back a deploy that
    # never ran. Keyed to the deploy job's own result, it cannot.
    #
    # This is the gap the two existing rollbacks do not cover. Both hang off
    # jobs DOWNSTREAM of the deploy (production-smoke-tests, e2e-prod), and a
    # failed deploy skips those jobs and their rollback steps with them.
    # 'cancelled' as well as 'failure'. Cancelling mid-deploy leaves production
    # exactly as half-deployed as a crash does, and deploy-production sets
    # cancel-in-progress: false, so this can only be a human pressing cancel —
    # never the pipeline cancelling itself. The marker check below still makes
    # a cancel during the pre-flights a no-op.
    if: >-
      always() && (
        needs.deploy-production.result == 'failure' ||
        needs.deploy-production.result == 'cancelled'
      )
    steps:
      - name: Roll back, but only if the deploy actually mutated the box
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          envs: APP_DIR
          script: |
            set -e
            # The same identity assertion the deploy and the other two rollback
            # paths carry, inline for the same reason: rollback.sh resets the
            # tree and retags images over :latest, so a SERVER_HOST pointed at
            # the wrong droplet does more damage here than a deploy would.
            [ "$(hostname)" = "retina-prod" ] || { echo "::error::Refusing to roll back on '$(hostname)' — expected retina-prod."; exit 1; }
            cd ${{ env.APP_DIR }}

            # deploy-production writes this marker immediately after
            # pre-deploy.sh captures the rollback point, and clears it once the
            # app answers /api/health. Its absence means the deploy died in its
            # pre-flights with the running stack untouched.
            #
            # Rolling back in that case would be actively harmful rather than
            # merely pointless: tower-finder:rollback and the newest deploy-*
            # tag still describe the PREVIOUS deploy's snapshot, so rollback.sh
            # would drag production back past a deploy that succeeded in order
            # to recover from one that never started.
            if [ ! -f .deploy-in-progress ]; then
              echo "No .deploy-in-progress marker — the deploy failed before mutating anything, so what is running is already the last-known-good build. Nothing to roll back."
              exit 0
            fi

            MARKER=$(cat .deploy-in-progress)

            # The marker records which run wrote it. One from a DIFFERENT run
            # means an earlier deploy was left mid-flight and never recovered —
            # its rollback failed, or someone cancelled and walked away — and
            # this run then died in its own pre-flights without touching
            # anything.
            #
            # Rolling back on that would be a guess. The box could be an
            # unrecovered outage, or one a human has already fixed forward by
            # hand and not tidied up after; rollback.sh would undo the second.
            # Reporting "nothing to roll back" would be worse still — a green
            # run over a production box that is genuinely broken. So stop, and
            # say exactly what is ambiguous.
            case "$MARKER" in
              "run ${{ github.run_id }} "*) ;;
              *)
                echo "::error::${{ env.APP_DIR }}/.deploy-in-progress was left behind by a different run (${MARKER}). Production was put mid-deploy earlier and never confirmed healthy since. Refusing to roll back automatically, because this run touched nothing and cannot tell an unrecovered outage from a box already fixed by hand. Inspect retina-prod, recover it, then delete the marker."
                exit 1
                ;;
            esac

            echo "Deploy failed after it began mutating the box (${MARKER}). Rolling back..."

            # rollback.sh distinguishes three outcomes and `set -e` would
            # collapse the last two, so take its status explicitly.
            set +e
            bash deploy/rollback.sh
            rc=$?
            set -e

            case "$rc" in
              0)
                rm -f .deploy-in-progress
                echo "Rollback complete — production is back on the previous build."
                ;;
              2)
                # Service restored, but the database is left ahead of the code
                # now running against it. The box is no longer mid-deploy, so
                # the marker goes; the run stays red so a human sees the report.
                rm -f .deploy-in-progress
                echo "::error::Production is back up, but a database downgrade is outstanding — see the report above before trusting this rollback."
                exit 2
                ;;
              *)
                # Marker deliberately left in place: the box is still
                # mid-deploy, and that is exactly what the next run must know.
                echo "::error::Rollback FAILED (exit ${rc}). Production may still be down — SSH to retina-prod and recover by hand, then delete ${{ env.APP_DIR }}/.deploy-in-progress so the next deploy is not blocked by it."
                exit "$rc"
                ;;
            esac


  production-smoke-tests:
    name: Production smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [deploy-production]
    steps:
      - uses: actions/checkout@v4
      - name: Let production settle
        run: |
          # This step used to hold the deploy until the simulated fleet had
          # reconnected at ≥10 active nodes. Production no longer runs one, and
          # the only nodes left are real boards, so that assertion would now
          # gate every production deploy — and, via the rollback step below, an
          # automatic revert of a good build — on third-party hardware being
          # online. Node health is a fleet-monitoring concern, not a deploy gate.
          #
          # The wait itself is kept: the app was restarted moments ago and the
          # smoke tests should not race its warmup. The deploy job has already
          # confirmed /api/health.
          echo "Waiting 60s for the app to settle before smoke tests..."
          sleep 60
      - name: Run production smoke tests
        id: smoke
        timeout-minutes: 15
        env:
          BASE_URL: https://api.retina.fm
        run: |
          CURL="curl -s --connect-timeout 10 --max-time 60"
          PASS=0; FAIL=0

          check_status() {
            local name="$1" url="$2" expected="$3"
            printf "  %-40s " "$name"
            # Retry once on connection error (transient load spikes just after
            # the app restarts)
            CODE=$($CURL -o /dev/null -w "%{http_code}" "$url" 2>/dev/null) \
              || CODE=$($CURL -o /dev/null -w "%{http_code}" "$url" 2>/dev/null) \
              || { echo "FAIL (connection)"; FAIL=$((FAIL+1)); return; }
            if [ "$CODE" = "$expected" ]; then echo "OK ($CODE)"; PASS=$((PASS+1)); else echo "FAIL ($CODE != $expected)"; FAIL=$((FAIL+1)); fi
          }

          echo "── Production Smoke Tests ──"
          check_status "GET /api/health"          "${BASE_URL}/api/health"            "200"
          check_status "GET /api/radar/nodes"     "${BASE_URL}/api/radar/nodes"       "200"
          check_status "GET /api/radar/analytics" "${BASE_URL}/api/radar/analytics"   "200"
          check_status "GET /api/test/dashboard"  "${BASE_URL}/api/test/dashboard"    "200"
          check_status "GET /api/test/mlat-verification" "${BASE_URL}/api/test/mlat-verification" "200"
          check_status "GET /api/config"          "${BASE_URL}/api/config"            "200"
          check_status "GET / (frontend)"         "https://towers.retina.fm/"         "200"
          check_status "GET /api/health (api.retina.fm)" "${BASE_URL}/api/health"     "200"

          # Wait for storage scan (background du task, 202 = still scanning)
          printf "  %-40s " "GET /api/admin/storage"
          for i in $(seq 1 24); do
            SCODE=$(curl -sk -o /dev/null -w "%{http_code}" "${BASE_URL}/api/admin/storage")
            if [ "$SCODE" = "200" ]; then echo "OK (200)"; PASS=$((PASS+1)); break; fi
            if [ "$SCODE" = "202" ] && [ "$i" = "24" ]; then echo "WARN (202 still scanning after 120s)"; PASS=$((PASS+1)); break; fi
            if [ "$i" = "24" ]; then echo "FAIL ($SCODE != 200 after 120s)"; FAIL=$((FAIL+1)); break; fi
            sleep 5
          done

          # Check aircraft data is flowing
          AIRCRAFT=$(curl -sk "${BASE_URL}/api/test/dashboard" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['pipeline']['aircraft_on_map'])" 2>/dev/null) || AIRCRAFT=0
          printf "  %-40s " "Aircraft on map > 0"
          if [ "${AIRCRAFT:-0}" -gt 0 ]; then echo "OK ($AIRCRAFT)"; PASS=$((PASS+1)); else echo "WARN ($AIRCRAFT — real nodes may be quiet or still connecting)"; fi

          # Guard against a runaway population. Production runs no simulator now,
          # so anything near this ceiling means either a `--profile sim` fleet was
          # left running or the analytics manager is not evicting (ClickUp
          # 86caxcbc3). Kept at 220 rather than retightened to the real headcount
          # so a node cutover cannot fail a deploy.
          NODES=$(curl -sk "${BASE_URL}/api/test/dashboard" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['nodes']['active'])" 2>/dev/null) || NODES=0
          printf "  %-40s " "Active nodes ≤ 220"
          if [ "${NODES:-0}" -le 220 ]; then echo "OK ($NODES)"; PASS=$((PASS+1)); else echo "FAIL ($NODES > 220 — a simulator fleet may be running, or nodes are not being evicted)"; FAIL=$((FAIL+1)); fi

          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ] || exit 1
      # Auto-rollback on smoke failure, mirroring the prod E2E job. A failed
      # smoke test means a bad build is live serving prod; revert to
      # last-known-good rather than leaving it up for a human to catch. The
      # condition is scoped to the smoke step's own outcome, so a failure in the
      # settle step above fails the job for a human to inspect without
      # triggering an automatic rollback.
      - name: Rollback production on smoke-test failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR
          script: |
            # See the identical assertion in e2e-prod's rollback step.
            [ "$(hostname)" = "retina-prod" ] || { echo "::error::Refusing to roll back on '$(hostname)' — expected retina-prod."; exit 1; }
            echo "Production smoke tests failed — rolling back production..."
            cd ${{ env.APP_DIR }} && bash deploy/rollback.sh
