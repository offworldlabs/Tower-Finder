# The ops hooks are scoped to backend/ with args: [backend] — dead-code must not
# walk libs/, which holds the retina-* submodules that run these same hooks in
# their own repos, and ruff-config must find backend/pyproject.toml rather than
# a root one that does not exist.
#
# The ruff hooks are unrestricted: they cover backend/ and deploy/ alike.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/offworldlabs/ops
    rev: hooks-v1.0
    hooks:
      - id: dead-code
        args: [backend]
      - id: ruff-config
        args: [backend]
