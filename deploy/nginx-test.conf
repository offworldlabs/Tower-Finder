# ── Test Droplet Nginx Configuration (retina-test) ────────────────────────────
# Serves test-towers, test-api, test-map and test-dash under retina.fm, mirroring
# production's towers/api/map/dash. Selected by start.sh when NGINX_PROFILE=test,
# which docker-compose.test.yml sets explicitly (the profile is never derived from
# RETINA_ENV, since prod also runs RETINA_ENV=test but must keep nginx.conf).
#
# The droplet is entirely synthetic: its fleet is the only source of detections,
# so test-map IS the synthetic map surface and there is no test-testmap. See the
# hostname predicates in frontend/src/utils/domains.ts, whose isMapDomain admits
# the `test-` prefix precisely so test-map lands on the live-radar view.
#
# There is deliberately no test-admin: admin is a production-only surface.
#
# Rate-limit zones (api, auth) come from nginx-security.conf, which the Dockerfile
# installs into /etc/nginx/conf.d/ so it applies at http {} scope to every profile.
#
# Requires a Cloudflare Origin certificate at /etc/ssl/cloudflare/{cert,key}.pem,
# bind-mounted read-only by the compose base. Records are proxied at Cloudflare,
# so this cert is what the edge validates against, not a public CA chain.

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name test-towers.retina.fm test-api.retina.fm test-map.retina.fm test-dash.retina.fm _;
    return 301 https://$host$request_uri;
}

# test-towers.retina.fm — tower search frontend
server {
    listen 443 ssl;
    server_name test-towers.retina.fm;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /app/frontend/dist;
    index index.html;

    # WebSocket → FastAPI backend
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API requests → FastAPI backend
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entry point
    location = /index.html {
        add_header Cache-Control "no-store, no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# test-api.retina.fm — dedicated API subdomain.
# Unlike prod's api.retina.fm this keeps no separate /api/auth/ block: the tighter
# zone=auth limit protects a login flow the test droplet does not run (auth is
# bypassed here, see RETINA_ENV below in docker-compose.test.yml).
server {
    listen 443 ssl;
    server_name test-api.retina.fm;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

