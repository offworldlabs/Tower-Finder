# ── Real client IP behind Cloudflare (must precede the zones below) ──────────
# Every deployed hostname is proxied through Cloudflare, so without this
# $binary_remote_addr is the *Cloudflare edge* address and every limit_req zone
# below buckets per-edge rather than per-client. That fails open and silently:
# nginx starts fine, logs nothing, and the limits simply never fire. It is how
# the /api/auth/ limit sat inert from the day it was written — ten rapid
# requests to /api/auth/me returned 200 on both staging and production.
#
# `set_real_ip_from` is what makes `real_ip_header` safe: the header is only
# honoured from these source ranges, so a direct connection to the origin from
# anywhere else keeps its true $remote_addr and cannot spoof a client IP. That
# guarantee is only as good as this list — see ClickUp 86cb2d022 (keep
# Cloudflare's published ranges fresh) and 86cb2cymj (make the origin
# unreachable except through Cloudflare).
#
# Source: https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched 2026-08-10).
# `real_ip_recursive` is deliberately absent: CF-Connecting-IP carries a single
# address, not an X-Forwarded-For chain.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── Rate limiting zones (must live in http {} context) ───────────────────────
# General API: 30 requests/s per IP (burst allows short spikes)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# Credential endpoints (/api/auth/login/, /api/auth/callback/): 5 requests/min
# per IP. Deliberately tight — this is the brute-force surface.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
# Session reads (/api/auth/me*, /api/auth/logout): 30 requests/min per IP.
# These are not a credential surface, and one map page load spends TWO of them
# (useAuth() calls fetchMe() then fetchMyNodes(), frontend/src/components/map/
# hooks.ts). Under the `auth` zone's burst=3 a second refresh within a few
# seconds would 429 a legitimate user — harmless while the limit was inert,
# user-visible the moment real client IPs made it bite.
limit_req_zone $binary_remote_addr zone=session:10m rate=30r/m;
