# ── Real client IP behind Cloudflare (must precede the zones below) ──────────
# Every deployed hostname is proxied through Cloudflare, so without this
# $binary_remote_addr is the *Cloudflare edge* address and every limit_req zone
# below buckets per-edge rather than per-client. That fails open and silently:
# nginx starts fine, logs nothing, and the limits simply never fire. It is how
# the /api/auth/ limit sat inert from the day it was written — ten rapid
# requests to /api/auth/me returned 200 on both staging and production.
#
# `set_real_ip_from` is what makes `real_ip_header` safe: the header is only
# honoured from these source ranges, so a direct connection to the origin from
# anywhere else keeps its true $remote_addr and cannot spoof a client IP. That
# guarantee is only as good as this list — see ClickUp 86cb2d022 (keep
# Cloudflare's published ranges fresh) and 86cb2cymj (make the origin
# unreachable except through Cloudflare).
#
# Source: https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched 2026-08-10).
# `real_ip_recursive` is deliberately absent: CF-Connecting-IP carries a single
# address, not an X-Forwarded-For chain.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── Rate limiting zones (must live in http {} context) ───────────────────────
# Answer a throttled request with 429 Too Many Requests, not nginx's default
# 503 Service Unavailable. 503 misreports a client-side limit as a server
# outage — it tells clients and uptime monitors the service is down, and
# Cloudflare treats it as an origin failure. deploy/staging-smoke-test.sh
# asserts 429 specifically.
limit_req_status 429;

# General API: 30 requests/s per IP (burst allows short spikes)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# Credential endpoints (/api/auth/login/, /api/auth/callback/): 5 requests/min
# per IP. Deliberately tight — this is the brute-force surface.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
# Session reads (/api/auth/me*, /api/auth/logout): 5 requests/s per IP.
# Not a credential surface — these read or drop an existing session — so this
# is an abuse bound, not a brute-force control. Sized deliberately loose,
# because keying on the real client IP makes "one IP" mean more than one user:
#   - the Playwright E2E suite drives 32 page loads fully in parallel from a
#     single CI runner address, and every SPA load spends TWO requests here
#     (useAuth() calls fetchMe() then fetchMyNodes(), frontend/src/components/
#     map/hooks.ts). At 30r/m that suite would have flaked.
#   - a NAT'd office or CGNAT mobile range shares one address between many
#     real users. Per-IP limits that looked fine against Cloudflare edge
#     addresses get sharper the moment they resolve to actual clients.
limit_req_zone $binary_remote_addr zone=session:10m rate=5r/s;
