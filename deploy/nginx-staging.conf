# ── Staging Environment Nginx Configuration ───────────────────────────────────
# Serves staging-towers (tower search), staging-api,
# staging-map and staging-dash, all under retina.fm, mirroring production's
# towers/api/map/dash. staging is entirely synthetic, so staging-map already is
# the synthetic map surface (see the hostname predicates in
# frontend/src/utils/domains.ts) and staging-testmap 301s to it.
# Deployed via `docker compose -f docker-compose.yml -f docker-compose.staging.yml`.

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name staging-towers.retina.fm staging-api.retina.fm staging-dash.retina.fm staging-map.retina.fm staging-testmap.retina.fm _;
    return 301 https://$host$request_uri;
}

# staging-towers.retina.fm — tower search frontend (mirrors prod towers.retina.fm)
server {
    listen 443 ssl;
    server_name staging-towers.retina.fm;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /app/frontend/dist;
    index index.html;

    # WebSocket → FastAPI backend
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API requests → FastAPI backend
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entry point
    location = /index.html {
        add_header Cache-Control "no-store, no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

