# staging-testmap.retina.fm — 301 to staging-map.
# Staging is entirely synthetic, so staging-map already IS the synthetic map
# surface and a separate testmap host would serve identical content over the same
# feed. Kept as a redirect rather than deleted: the DNS record and any bookmarks,
# CI secrets or links pointing here still resolve, and $request_uri preserves the
# path and query so deep links into the map survive the hop.
server {
    listen 443 ssl;
    server_name staging-testmap.retina.fm;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://staging-map.retina.fm$request_uri;
}

