# tower-finder.retina.fm — standalone tower-finder-service (separate compose
# stack, reached over the shared `retina-edge` docker network)
server {
    listen 443 ssl;
    server_name tower-finder.retina.fm;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=api burst=60 nodelay;
        # Resolve the upstream via Docker's embedded DNS at request time (note
        # the variable) so this nginx still boots when the tower-finder-service
        # stack is down — a missing upstream then 502s instead of failing boot.
        resolver 127.0.0.11 valid=10s;
        set $tfs_upstream tower-finder-service;
        proxy_pass http://$tfs_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
