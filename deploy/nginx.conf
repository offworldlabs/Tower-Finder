# testapi.retina.fm — 301 to api.retina.fm.
# The alias terminated on the same 127.0.0.1:8000 as api and gated nothing, so it
# no longer has a server block of its own. It keeps a redirect rather than being
# deleted outright: the DNS record still resolves, and with no default_server on
# 443 an unmatched name would silently fall through to the FIRST 443 block
# (towers.retina.fm), answering API calls with the tower-search SPA and a 200.
# HTML where JSON is expected fails far from the cause; a 301 does not.
# $request_uri is preserved so /api/... paths land on the same path under api.
server {
    listen 443 ssl;
    server_name testapi.retina.fm;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://api.retina.fm$request_uri;
}

