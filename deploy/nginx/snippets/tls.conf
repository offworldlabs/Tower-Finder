# Cloudflare origin certificate. The cert's SANs are *.retina.fm + retina.fm,
# so it covers every vhost in both environments — which is why the staging and
# production renders of nginx.conf.template can be structurally identical even
# for hostnames that have no DNS record yet.
ssl_certificate     /etc/ssl/cloudflare/cert.pem;
ssl_certificate_key /etc/ssl/cloudflare/key.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
