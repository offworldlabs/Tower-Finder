# Credential endpoints (/api/auth/login/*, /api/auth/callback/*) — tighter rate
# limit than the general API (the `auth` zone is 5r/m, `api` is 30r/s; both are
# defined in deploy/nginx-security.conf).
#
# Staging previously omitted this location entirely, so this limit was never
# exercised before a change reached production, even though the zone was
# already defined on both hosts. It was inert on BOTH hosts for a further
# reason: without real_ip the zone keyed on the Cloudflare edge address, not the
# client. See deploy/nginx-security.conf.
#
# The session reads that also live under /api/auth/ (me, me/nodes,
# me/claim-codes, logout) are matched by their own longer-prefix locations and
# use snippets/session.conf — 5r/m burst=3 is too tight for endpoints a single
# page load hits twice.
limit_req zone=auth burst=3 nodelay;
proxy_pass http://127.0.0.1:8000;
# RETINA_INCLUDE snippets/proxy-common.conf
proxy_read_timeout 30s;
