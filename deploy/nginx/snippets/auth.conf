# Auth endpoints — tighter rate limit than the general API (the `auth` zone is
# 5r/m, `api` is 30r/s; both are defined in deploy/nginx-security.conf).
#
# Staging previously omitted this location entirely, so this limit was never
# exercised before a change reached production, even though the zone was
# already defined on both hosts.
limit_req zone=auth burst=3 nodelay;
proxy_pass http://127.0.0.1:8000;
# RETINA_INCLUDE snippets/proxy-common.conf
proxy_read_timeout 30s;
