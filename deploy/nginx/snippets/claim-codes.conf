# Claim-code mint/revoke/list (/api/auth/me/claim-codes) — same backend as
# snippets/session.conf but the `claimcode` zone (20r/m burst=5) rather than
# `session` (5r/s burst=20).
#
# POST mints a device-claim credential and DELETE revokes one, so these are not
# the session reads the /api/auth/me prefix was widened for. Matched ahead of
# that prefix by longest-prefix matching. Applied to all methods rather than
# keyed off $request_method: the GET that lists codes is on-demand (the
# dashboard's OnboardingPage loads it on mount, not on a poll), so a single
# uniform limit avoids a map/method-matching layer for no practical gain.
limit_req zone=claimcode burst=5 nodelay;
proxy_pass http://127.0.0.1:8000;
# RETINA_INCLUDE snippets/proxy-common.conf
proxy_read_timeout 30s;
