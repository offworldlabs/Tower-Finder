# Security headers for vhosts that serve HTML (the SPA frontends).
#
# The connect-src placeholder below is substituted at boot — it is the only
# host-naming part of the policy, so production and staging get the same CSP
# with their own API/admin origins. Staging previously had no CSP at all, which
# meant a policy-breaking change (a new CDN font, an inline script, a new
# connect-src origin) sailed through staging and only failed in production.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com blob:; connect-src 'self' ${CSP_CONNECT_SRC}; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
