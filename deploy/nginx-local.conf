# ── Local Nginx Configuration ────────────────────────────────────────────────
# HTTP-only local mirror of the testmap.retina.fm server block in nginx.conf
# (the prod config that actually serves testmap): it serves the React frontend
# (/app/frontend/dist) and proxies /ws/ + /api/ to the backend. On a testmap.*
# host the frontend defaults to the Live Radar view streaming all synthetic
# nodes (see frontend/src/utils/domains.ts), which is the point of this stack.
#
# Selected by start-test.sh when NGINX_PROFILE=local, which docker-compose.local.yml
# sets (the backend itself still runs RETINA_ENV=test). Endpoints are documented
# in docker-compose.local.yml.
#
# Dropped vs nginx.conf: TLS/redirect and the HSTS/CSP security headers, none of
# which apply to a plain-HTTP laptop run (and CSP's connect-src would otherwise
# have to be relaxed for the same-origin ws://testmap.localhost feed).

# testapi.localhost — API (plain reverse proxy for poking the backend)
server {
    listen 80;
    server_name testapi.localhost;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# testmap.localhost — the React live-radar frontend (also plain localhost:8080)
server {
    listen 80 default_server;
    server_name testmap.localhost;

    root /app/frontend/dist;
    index index.html;

    # WebSocket → FastAPI backend (the live aircraft feed the map depends on)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API requests → FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entry point (asset filenames are content-hashed)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
