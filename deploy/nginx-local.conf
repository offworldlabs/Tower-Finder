# ── Local Nginx Configuration ────────────────────────────────────────────────
# HTTP-only mirror of nginx-test.conf for running the test stack on a laptop
# (no Cloudflare certs available). Selected by start-test.sh when
# NGINX_PROFILE=local, which docker-compose.local.yml sets (the backend itself
# still runs RETINA_ENV=test). Endpoints are documented in docker-compose.local.yml.
#
# Trimmed vs nginx-test.conf: no TLS/redirect, and the WebSocket proxy and 7-day
# asset caching are dropped — the tar1090 static map polls data/*.json rather
# than using /ws/, and immutable caching only strands stale assets across a
# rebuild during local iteration.

# testapi.localhost — API (plain reverse proxy for poking the backend)
server {
    listen 80;
    server_name testapi.localhost;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# testmap.localhost — tar1090 live aircraft map (also plain localhost:8080)
server {
    listen 80 default_server;
    server_name testmap.localhost;

    root /app/tar1090/html;
    index index.html;

    # tar1090 data — proxied to FastAPI for the live aircraft feed
    location /data/receiver.json {
        proxy_pass http://127.0.0.1:8000/api/radar/data/receiver.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store";
    }

    location /data/aircraft.json {
        proxy_pass http://127.0.0.1:8000/api/radar/data/aircraft.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store";
    }

    # Serve tar1090 static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
