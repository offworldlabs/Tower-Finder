# ── Local Nginx Configuration ────────────────────────────────────────────────
# HTTP-only mirror of nginx-test.conf for running the test stack on a laptop
# (no Cloudflare certs available). Selected by start-test.sh when
# NGINX_PROFILE=local, which docker-compose.local.yml sets (the backend itself
# still runs RETINA_ENV=test).
#
# Browsers resolve *.localhost to 127.0.0.1, so with the local compose override
# publishing 8080:80:
#   http://testapi.localhost:8080  → API + WebSocket
#   http://testmap.localhost:8080  → tar1090 live aircraft map
# testmap is the default server, so plain http://localhost:8080 also shows the map.

# testapi.localhost — API + WebSocket
server {
    listen 80;
    server_name testapi.localhost;

    # WebSocket for live aircraft updates
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API endpoints
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# testmap.localhost — tar1090 live aircraft map
server {
    listen 80 default_server;
    server_name testmap.localhost;

    root /app/tar1090/html;
    index index.html;

    # tar1090 data — proxied to FastAPI for live aircraft feed
    location /data/receiver.json {
        proxy_pass http://127.0.0.1:8000/api/radar/data/receiver.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store";
    }

    location /data/aircraft.json {
        proxy_pass http://127.0.0.1:8000/api/radar/data/aircraft.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store";
    }

    # Serve tar1090 static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
